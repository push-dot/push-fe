appId: app.push.mobile
tags:
  - subflow
---
# clearState does not clear the iOS keychain, where expo-secure-store keeps the session.
- clearKeychain
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "개발 토큰으로 들어가기"
    timeout: 60000
- runFlow: _dismiss_logbox.yaml
- tapOn: "개발 토큰으로 들어가기"
- extendedWaitUntil:
    visible: "새로 올라온 공고"
    timeout: 20000
- runFlow: _dismiss_logbox.yaml
