appId: app.push.mobile
name: 에이전트로 시작 → 홈·마이를 열기 전에 그 탭으로 이동 → 탭 첫 화면 유지
---
# A launch into 에이전트 leaves 홈 unopened; a push into 홈 from there must keep the feed under it.
- runFlow: _login.yaml
- stopApp
- openLink: push://chat
- extendedWaitUntil:
    visible: "(동의하고 시작하기|공고 링크로 맞추기)"
    timeout: 60000
- runFlow: _dismiss_logbox.yaml
- runFlow:
    when:
      visible: "동의하고 시작하기"
    commands:
      - tapOn: "동의하고 시작하기"
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- openLink: push://chat?mock=empty:GET:me/bookmarks
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- tapOn: "대화 목록 열기"
- extendedWaitUntil:
    visible: "북마크한 공고"
    timeout: 5000
- tapOn: "북마크한 공고"
- extendedWaitUntil:
    visible: "북마크한 공고가 없어요."
    timeout: 10000
- tapOn: "채용공고 보기"
- extendedWaitUntil:
    visible: "공고 .*개"
    timeout: 20000
- takeScreenshot: 14_unopened_tab_push-01
- tapOn: "뒤로"
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- runFlow:
    file: _tap_tab.yaml
    env:
      TAB: "홈"
      READY: "새로 올라온 공고"
- assertNotVisible: "공고 .*개"
- takeScreenshot: 14_unopened_tab_push-02
# 마이 is unopened too: 제안함 reached from outside the tab (as from a notification) pushes the profile editor into it.
- openLink: push://offers?mock=empty:GET:me/offers.*box=received
- extendedWaitUntil:
    visible: "아직 받은 제안이 없어요."
    timeout: 10000
- tapOn: "허브 프로필 다듬기"
- extendedWaitUntil:
    visible: "저장"
    timeout: 10000
- takeScreenshot: 14_unopened_tab_push-03
- tapOn: "닫기"
- extendedWaitUntil:
    notVisible: "저장"
    timeout: 10000
- runFlow:
    when:
      visible: "아직 받은 제안이 없어요."
    commands:
      - tapOn: "뒤로"
- runFlow:
    file: _tap_tab.yaml
    env:
      TAB: "마이"
      READY: "김서준"
- assertNotVisible: "저장"
- takeScreenshot: 14_unopened_tab_push-04
