appId: app.push.mobile
name: AI 채팅 → 실행 방식 시트 → 항상 묻기
---
- runFlow: _login.yaml
- tapOn: "AI 채팅"
- extendedWaitUntil:
    visible: "실행 방식, .*"
    timeout: 10000
- tapOn: "실행 방식, .*"
# Native form sheet: iOS grabber sheet, Android Material bottom sheet.
- extendedWaitUntil:
    visible: "에이전트가 어떻게 실행할까요?"
    timeout: 5000
- tapOn: "항상 묻기"
- extendedWaitUntil:
    notVisible: "에이전트가 어떻게 실행할까요?"
    timeout: 5000
- assertVisible: "실행 방식, 항상 묻기"
