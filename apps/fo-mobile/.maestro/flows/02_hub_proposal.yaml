appId: app.push.mobile
name: 허브 → 프로필 → 제안하기
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
- tapOn: "허브"
- extendedWaitUntil:
    visible: "추천 프로필"
    timeout: 10000
- takeScreenshot: 02_hub_proposal-01
- tapOn: ".*이하은.*"
- extendedWaitUntil:
    visible: "제안하기"
    timeout: 20000
- takeScreenshot: 02_hub_proposal-02
- tapOn: "제안하기"
- tapOn: ".*어떤 이야기를 나누고 싶은지 적어 주세요"
- inputText: "Coffee chat?"
# The keyboard covers 제안 보내기 in the native sheet; tapping sheet text closes it, as a user would.
- tapOn: "이하은 님에게"
- runFlow:
    file: _tap_sheet_button.yaml
    env:
      TEXT: "제안 보내기"
- assertNotVisible: "제안 보내기"
