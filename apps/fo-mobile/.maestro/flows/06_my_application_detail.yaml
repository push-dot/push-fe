- runFlow: _login.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- takeScreenshot: 06_my_application_detail-01
- tapOn: "내 활동"
# The row's accessibility label is "<company> <title> <stage>".
- tapOn: ".*백엔드 엔지니어 \\(Kotlin·Spring\\).*"
- extendedWaitUntil:
    visible: "면접 진행 중"
    timeout: 10000
- takeScreenshot: 06_my_application_detail-02
- assertVisible: "결제 플랫폼팀 1차 면접"
- takeScreenshot: 06_my_application_detail-03
- assertVisible: "Push 에이전트로 면접 준비"
- takeScreenshot: 06_my_application_detail-04
- assertVisible: "지원한 서류"
- takeScreenshot: 06_my_application_detail-05
