appId: app.push.mobile
name: 에이전트 → 사이드바 → 내 서류 보기·삭제 → 에이전트로 만들기 → 에이전트 홈
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
- runFlow:
    file: _tap_tab.yaml
    env:
      TAB: "에이전트"
      READY: "(동의하고 시작하기|공고 링크로 맞추기)"
- runFlow:
    when:
      visible: "동의하고 시작하기"
    commands:
      - tapOn: "동의하고 시작하기"
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- takeScreenshot: 09_sidebar_docs_empty_start-01

# 내 서류 → 서류 보기 → 뒤로
- tapOn: "대화 목록 열기"
- extendedWaitUntil:
    visible: "내 서류"
    timeout: 5000
- tapOn: "내 서류"
- extendedWaitUntil:
    visible: ".*김서준_백엔드_이력서_2026.pdf 더 보기"
    timeout: 10000
- tapOn: ".*김서준_백엔드_이력서_2026.pdf 더 보기"
- tapOn: "서류 보기"
- extendedWaitUntil:
    visible: "에이전트로 고치기"
    timeout: 20000
- takeScreenshot: 09_sidebar_docs_empty_start-02
- tapOn: "뒤로"
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- assertNotVisible: "내 서류"
- takeScreenshot: 09_sidebar_docs_empty_start-03

# Delete one at a time and wait for the row to go, so the next menu tap never lands on a stale row.
- tapOn: "대화 목록 열기"
- extendedWaitUntil:
    visible: "내 서류"
    timeout: 5000
- tapOn: "내 서류"
- extendedWaitUntil:
    visible: ".*김서준_백엔드_이력서_2026.pdf 더 보기"
    timeout: 10000
- tapOn: ".*김서준_백엔드_이력서_2026.pdf 더 보기"
- tapOn: "서류 삭제하기"
- extendedWaitUntil:
    visible: "이 서류를 삭제할까요?"
    timeout: 5000
- runFlow:
    file: _tap_sheet_button.yaml
    env:
      TEXT: "삭제"
- extendedWaitUntil:
    notVisible: ".*김서준_백엔드_이력서_2026.pdf 더 보기"
    timeout: 10000
- tapOn: ".*경력기술서_모아페이.docx 더 보기"
- tapOn: "서류 삭제하기"
- extendedWaitUntil:
    visible: "이 서류를 삭제할까요?"
    timeout: 5000
- runFlow:
    file: _tap_sheet_button.yaml
    env:
      TEXT: "삭제"
- extendedWaitUntil:
    notVisible: ".*경력기술서_모아페이.docx 더 보기"
    timeout: 10000
- tapOn: ".*포트폴리오_결제시스템.pdf 더 보기"
- tapOn: "서류 삭제하기"
- extendedWaitUntil:
    visible: "이 서류를 삭제할까요?"
    timeout: 5000
- runFlow:
    file: _tap_sheet_button.yaml
    env:
      TEXT: "삭제"
- extendedWaitUntil:
    notVisible: ".*포트폴리오_결제시스템.pdf 더 보기"
    timeout: 10000
- tapOn: ".*모아페이_맞춤_이력서_v2.pdf 더 보기"
- tapOn: "서류 삭제하기"
- extendedWaitUntil:
    visible: "이 서류를 삭제할까요?"
    timeout: 5000
- runFlow:
    file: _tap_sheet_button.yaml
    env:
      TEXT: "삭제"
- extendedWaitUntil:
    visible: "아직 등록한 서류가 없어요."
    timeout: 10000
- takeScreenshot: 09_sidebar_docs_empty_start-04
- tapOn: "에이전트로 만들기"
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- assertNotVisible: "아직 등록한 서류가 없어요."
- assertNotVisible: "사이드바 닫기"
- assertNotVisible: "북마크한 공고"
- takeScreenshot: 09_sidebar_docs_empty_start-05
