appId: app.push.mobile
name: 에이전트 → 대화 이름 바꾸기·링크 추가 시트 → 키보드가 떠 있어도 버튼 보임
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
- runFlow:
    file: _tap_tab.yaml
    env:
      TAB: "에이전트"
      READY: "(동의하고 시작하기|공고 링크로 맞추기)"
- runFlow:
    when:
      visible: "동의하고 시작하기"
    commands:
      - tapOn: "동의하고 시작하기"
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- takeScreenshot: 10_sheet_keyboard_rename-01

# 대화 이름 바꾸기: the field autofocuses, so the keyboard is up and stays up.
- tapOn: "대화 목록 열기"
- extendedWaitUntil:
    visible: "최근 대화 모두 보기"
    timeout: 5000
- tapOn: "최근 대화 모두 보기"
- extendedWaitUntil:
    visible: "경력기술서 다듬기"
    timeout: 10000
# The row's menu opens on long press on both platforms; a tap opens the thread.
# Android drops a long press made while the modal still slides in, so wait and retry.
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - longPressOn: "경력기술서 다듬기"
      - extendedWaitUntil:
          visible: "이름 바꾸기"
          timeout: 4000
- tapOn: "이름 바꾸기"
- extendedWaitUntil:
    visible: "대화 이름을 바꿀까요?"
    timeout: 5000
- eraseText
- inputText: "Renamed chat"
- assertVisible: "대화 이름"
- assertVisible: "이름 바꾸기"
- takeScreenshot: 10_sheet_keyboard_rename-02
- runFlow:
    file: _tap_sheet_button.yaml
    env:
      TEXT: "이름 바꾸기"
- extendedWaitUntil:
    notVisible: "대화 이름을 바꿀까요?"
    timeout: 5000
- extendedWaitUntil:
    visible: "Renamed chat"
    timeout: 10000
- takeScreenshot: 10_sheet_keyboard_rename-03

# 링크 추가: closing the list returns to the sidebar
- tapOn: "닫기"
- extendedWaitUntil:
    visible: "내 링크"
    timeout: 5000
- tapOn: "내 링크"
- extendedWaitUntil:
    visible: ".*결제 플랫폼 시니어 엔지니어 더 보기"
    timeout: 10000
- tapOn: "링크 추가"
# The page's own 링크 추가 button shares the sheet's title, so wait on the sheet's description.
- extendedWaitUntil:
    visible: "링크를 붙여넣으면 종류를 알아서 골라요."
    timeout: 5000
- inputText: "github.com/push-e2e"
- assertVisible: "추가하기"
- takeScreenshot: 10_sheet_keyboard_rename-04
- runFlow:
    file: _tap_sheet_button.yaml
    env:
      TEXT: "추가하기"
- extendedWaitUntil:
    notVisible: "링크를 붙여넣으면 종류를 알아서 골라요."
    timeout: 5000
- extendedWaitUntil:
    visible: ".*github.com/push-e2e.*"
    timeout: 10000
- takeScreenshot: 10_sheet_keyboard_rename-05
