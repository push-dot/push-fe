appId: app.push.mobile
name: 에이전트 → 대화 → 키보드가 떠 있어도 보내기 버튼 보임
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
- runFlow:
    file: _tap_tab.yaml
    env:
      TAB: "에이전트"
      READY: "(동의하고 시작하기|공고 링크로 맞추기)"
- runFlow:
    when:
      visible: "동의하고 시작하기"
    commands:
      - tapOn: "동의하고 시작하기"
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
# Empty composer reads "메시지 <placeholder>" on iOS, typed text reads "메시지".
- tapOn: "메시지.*"
- inputText: "tailor hold"
- hideKeyboard:
    optional: true
- tapOn: "보내기"
- extendedWaitUntil:
    visible: ".*기술 스택을 비교하는 중.*"
    timeout: 40000
# The conversation screen: type with the keyboard up and send without lowering it.
# The tap lands on a keyboard key if the composer is hidden behind the keyboard.
- tapOn: "메시지.*"
- inputText: "use numbers"
- takeScreenshot: 12_chat_composer_keyboard-01
- tapOn: "보내기"
# The queued chip is painted after the keyboard inset settles. 10s raced that layout, so wait out the same budget as the working line.
- extendedWaitUntil:
    visible: ".*대기 중.*"
    timeout: 40000
- takeScreenshot: 12_chat_composer_keyboard-02
