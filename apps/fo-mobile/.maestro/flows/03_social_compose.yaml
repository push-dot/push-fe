appId: app.push.mobile
name: 소셜 → 글쓰기 → 게시
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
- runFlow:
    file: _tap_tab.yaml
    env:
      TAB: "소셜"
      READY: "직장 생활"
- extendedWaitUntil:
    visible: "직장 생활"
    timeout: 10000
- takeScreenshot: 03_social_compose-01
- tapOn: "글쓰기"
- tapOn: "카테고리.*"
- tapOn: "개발"
- tapOn:
    id: "compose-title"
- inputText: "Maestro E2E post"
- tapOn:
    id: "compose-body"
- inputText: "Written by the Maestro flow"
- tapOn: "게시"
- extendedWaitUntil:
    visible: ".*Maestro E2E post.*"
    timeout: 10000
- takeScreenshot: 03_social_compose-02
