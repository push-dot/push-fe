appId: app.push.mobile
name: 소셜 → 글쓰기 → 게시
---
- runFlow: _login.yaml
- tapOn: "소셜"
- extendedWaitUntil:
    visible: "직장 생활"
    timeout: 10000
- tapOn: "글쓰기"
- tapOn: "카테고리.*"
- tapOn: "개발"
- tapOn: "제목"
- inputText: "Maestro E2E post"
- tapOn: "본문"
- inputText: "Written by the Maestro flow"
- tapOn: "게시"
- extendedWaitUntil:
    visible: "Maestro E2E post"
    timeout: 10000
