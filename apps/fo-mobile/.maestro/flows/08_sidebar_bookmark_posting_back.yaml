appId: app.push.mobile
name: 에이전트 → 사이드바 → 북마크·링크에서 공고 보기·대화 시작 → 뒤로 → 에이전트 홈
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
- runFlow:
    file: _tap_tab.yaml
    env:
      TAB: "에이전트"
      READY: "(동의하고 시작하기|공고 링크로 맞추기)"
- runFlow:
    when:
      visible: "동의하고 시작하기"
    commands:
      - tapOn: "동의하고 시작하기"
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- takeScreenshot: 08_sidebar_bookmark_posting_back-01

# 북마크한 공고 → 공고 보기 → 뒤로
- tapOn: "대화 목록 열기"
- extendedWaitUntil:
    visible: "북마크한 공고"
    timeout: 5000
- tapOn: "북마크한 공고"
- extendedWaitUntil:
    visible: ".*모아페이.*"
    timeout: 10000
- tapOn: ".*모아페이.*"
- tapOn: "공고 보기"
- extendedWaitUntil:
    visible: "에이전트로 맞추기"
    timeout: 20000
- takeScreenshot: 08_sidebar_bookmark_posting_back-02
- tapOn: "뒤로"
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- assertNotVisible: "북마크한 공고"
- takeScreenshot: 08_sidebar_bookmark_posting_back-03

# 북마크한 공고 → 이 공고에 맞춰 대화 시작 → 뒤로
- tapOn: "대화 목록 열기"
- extendedWaitUntil:
    visible: "북마크한 공고"
    timeout: 5000
- tapOn: "북마크한 공고"
- extendedWaitUntil:
    visible: ".*모아페이.*"
    timeout: 10000
- tapOn: ".*모아페이.*"
- tapOn: "이 공고에 맞춰 대화 시작"
# The thread header's menu button exists only on the conversation screen.
- extendedWaitUntil:
    visible: "대화 더 보기"
    timeout: 20000
- takeScreenshot: 08_sidebar_bookmark_posting_back-04
# The thread has no back button: Android back, iOS edge swipe.
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 50%
          end: 80%, 50%
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- assertNotVisible: "대화 더 보기"
- assertNotVisible: "북마크한 공고"
- takeScreenshot: 08_sidebar_bookmark_posting_back-05

# 내 링크 → 에이전트에서 쓰기 → 뒤로
- tapOn: "대화 목록 열기"
- extendedWaitUntil:
    visible: "내 링크"
    timeout: 5000
- tapOn: "내 링크"
- extendedWaitUntil:
    visible: ".*결제 플랫폼 시니어 엔지니어 더 보기"
    timeout: 10000
- tapOn: ".*결제 플랫폼 시니어 엔지니어 더 보기"
- tapOn: "에이전트에서 쓰기"
- extendedWaitUntil:
    visible: "대화 더 보기"
    timeout: 20000
- takeScreenshot: 08_sidebar_bookmark_posting_back-06
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 50%
          end: 80%, 50%
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- assertNotVisible: "대화 더 보기"
- assertNotVisible: "내 링크"
- takeScreenshot: 08_sidebar_bookmark_posting_back-07
