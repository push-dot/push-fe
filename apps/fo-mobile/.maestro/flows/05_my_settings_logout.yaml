appId: app.push.mobile
name: 마이 → 설정 → 로그아웃
---
- runFlow: _login.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "설정"
- scrollUntilVisible:
    element: "로그아웃"
    direction: DOWN
- tapOn: "로그아웃"
# Retap if the confirm alert did not open (dropped first tap, see _tap_sheet_button.yaml).
- runFlow:
    when:
      notVisible: "취소"
    commands:
      - tapOn: "로그아웃"
- extendedWaitUntil:
    visible: "취소"
    timeout: 5000
# While the alert is up only its window is in the hierarchy, so this is the alert button.
- tapOn: "로그아웃"
- extendedWaitUntil:
    visible: "Google로 계속하기"
    timeout: 10000
