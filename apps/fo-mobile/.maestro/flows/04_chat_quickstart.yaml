appId: app.push.mobile
name: AI 채팅 → 빠른 시작(공고 링크) → 변경 확인 → 완료
---
- runFlow: _login.yaml
- tapOn: "AI 채팅"
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- tapOn: "공고 링크로 맞추기"
- tapOn: "공고 링크"
- inputText: "https://careers.moapay.kr/jobs/1182"
- runFlow:
    file: _tap_sheet_button.yaml
    env:
      TEXT: "맞추기 시작"
- extendedWaitUntil:
    visible: "그대로 두기"
    timeout: 60000
- tapOn: "적용"
- extendedWaitUntil:
    visible: "프로필 보기"
    timeout: 60000
