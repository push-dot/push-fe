appId: app.push.mobile
name: 에이전트 → 빠른 시작(공고 링크) → 변경 적용 → 완료
---
- runFlow: _login.yaml
- runFlow: _dismiss_logbox.yaml
- tapOn: "에이전트"
- runFlow:
    when:
      visible: "동의하고 시작하기"
    commands:
      - tapOn: "동의하고 시작하기"
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- tapOn: "공고 링크로 맞추기"
- tapOn: "공고 링크"
- inputText: "https://careers.moapay.kr/jobs/1182"
- runFlow:
    file: _tap_sheet_button.yaml
    env:
      TEXT: "맞추기 시작"
- extendedWaitUntil:
    visible: "이 수정을 적용할까요?"
    timeout: 60000
# iOS reads the numbered option as one label, "1. 적용".
- tapOn: ".*적용"
- extendedWaitUntil:
    visible: "Push 프로필에 저장했어요.*"
    timeout: 60000
