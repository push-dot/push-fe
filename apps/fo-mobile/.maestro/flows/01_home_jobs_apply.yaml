appId: app.push.mobile
name: 홈 → 채용공고 필터 → 상세 → 지원
---
- runFlow: _login.yaml
- assertVisible: "마감 임박 공고"
- takeScreenshot: 01_home_jobs_apply-01
- tapOn:
    text: "채용공고"
    index: 0
- extendedWaitUntil:
    visible: "공고 .*개"
    timeout: 10000
- takeScreenshot: 01_home_jobs_apply-02
- tapOn: "직군"
- tapOn: "개발"
# The count on the button refetches after each pick; let it settle before applying.
- waitForAnimationToEnd
- runFlow:
    file: _tap_sheet_button.yaml
    env:
      TEXT: "공고 .*개 보기"
- assertVisible: ".*개발.*"
- takeScreenshot: 01_home_jobs_apply-03
# Open the first dev posting; mock postings past their deadline drop out of the list.
- tapOn:
    text: ".*개발자.*"
    index: 0
- extendedWaitUntil:
    visible: "지원하기"
    timeout: 20000
- takeScreenshot: 01_home_jobs_apply-04
# The first tap on the CTA is sometimes dropped right after the detail screen settles (seen on iOS in PR #160, screen still on the detail); tap until the sheet shows.
- retry:
    maxRetries: 3
    commands:
      - tapOn: "지원하기"
      - extendedWaitUntil:
          visible: "이 서류로 지원하기"
          timeout: 6000
- tapOn: "이 서류로 지원하기"
- extendedWaitUntil:
    visible: "지원 완료"
    timeout: 10000
- takeScreenshot: 01_home_jobs_apply-05
