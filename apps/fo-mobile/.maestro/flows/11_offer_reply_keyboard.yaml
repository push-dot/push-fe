appId: app.push.mobile
name: 마이 → 받은 제안 → 수락하고 답장 → 키보드가 떠 있어도 보내기 버튼 보임
---
- runFlow: _login.yaml
- runFlow:
    file: _tap_tab.yaml
    env:
      TAB: "마이"
      READY: "김서준"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- takeScreenshot: 11_offer_reply_keyboard-01
- tapOn: "받은 제안 .*개"
- extendedWaitUntil:
    visible: ".*오지현.*"
    timeout: 10000
- tapOn: ".*오지현.*"
# Only an undecided offer (SENT/READ) offers the reply sheet.
- extendedWaitUntil:
    visible: "수락하고 답장하기"
    timeout: 10000
- takeScreenshot: 11_offer_reply_keyboard-02
- tapOn: "수락하고 답장하기"
- extendedWaitUntil:
    visible: "어떻게 답장할까요?"
    timeout: 5000
# iOS reads the input as its label plus placeholder: "답장 오지현 님에게 답장을 써 주세요.".
- tapOn: "답장.*"
- inputText: "Thanks, lets talk"
- assertVisible: "수락하고 보내기"
- takeScreenshot: 11_offer_reply_keyboard-03
- runFlow:
    file: _tap_sheet_button.yaml
    env:
      TEXT: "수락하고 보내기"
# Accepting redirects the detail to the offer's message thread, which starts with the reply.
- extendedWaitUntil:
    visible: "Thanks, lets talk"
    timeout: 10000
- assertNotVisible: "어떻게 답장할까요?"
- assertNotVisible: "수락하고 답장하기"
- takeScreenshot: 11_offer_reply_keyboard-04
