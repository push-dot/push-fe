appId: app.push.mobile
name: 마이 프로필 → 경력 편집 상태
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- extendedWaitUntil:
    visible: "경력 편집"
    timeout: 10000
- tapOn: "경력 편집"
- extendedWaitUntil:
    visible: "이 경력 삭제하기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: EditCareer

# The two state boards are iOS only.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "재직 중"
          index: 0
      - waitForAnimationToEnd
      - takeScreenshot: EditCareerStates.1
      - tapOn:
          text: "재직 중"
          index: 0
      - tapOn: "직무.*"
      - eraseText
      - runFlow: _hide_kbd.yaml
      - extendedWaitUntil:
          visible: "회사, 직무, 기간을 채워 주세요"
          timeout: 5000
      - waitForAnimationToEnd
      - takeScreenshot: EditCareerStates.2
