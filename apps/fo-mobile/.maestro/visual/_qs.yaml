appId: app.push.mobile
tags:
  - subflow
# Opens the quick-start pill ${LABEL}, waits for ${WAIT} (text that shows once the sheet data has loaded), shoots ${SHOT}, closes.
---
- scrollUntilVisible:
    element: ${LABEL}
    direction: RIGHT
    timeout: 20000
- tapOn: ${LABEL}
- extendedWaitUntil:
    visible: ${WAIT}
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: ${SHOT}
- runFlow:
    file: _close_sheet.yaml
    env:
      TITLE: ${WAIT}
- extendedWaitUntil:
    notVisible: ${WAIT}
    timeout: 5000
