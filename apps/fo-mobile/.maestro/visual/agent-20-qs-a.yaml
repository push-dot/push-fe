appId: app.push.mobile
name: 에이전트 · 빠른 시작 시트 (찾기 · 비교 · 점수 · 링크)
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _agent_tab.yaml
# QsLink draws the 복사한 링크 row, which the sheet shows for a link on the clipboard: copy the first one from 내 링크 (a row action, as a user would).
- tapOn: "대화 목록 열기"
- extendedWaitUntil:
    visible: "최근 대화"
    timeout: 10000
- tapOn: "내 링크"
- extendedWaitUntil:
    visible: "에이전트에서 @언급으로 불러오거나.*"
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    text: ".*더 보기"
    index: 0
- extendedWaitUntil:
    visible: "링크 복사"
    timeout: 5000
- tapOn: "링크 복사"
- waitForAnimationToEnd
# Closing a page sheet also closes the sidebar.
- tapOn: "닫기"
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    file: _qs.yaml
    env:
      LABEL: "나에게 맞는 공고 찾기"
      WAIT: "적합도 7점 이상인 공고만 보여 드려요"
      SHOT: QsMatch
- runFlow:
    file: _qs.yaml
    env:
      LABEL: "부족한 점 찾기"
      WAIT: ".*비교할 서류.*"
      SHOT: QsGap
- runFlow:
    file: _qs.yaml
    env:
      LABEL: "적합도 보기"
      WAIT: ".*비교할 서류.*"
      SHOT: QsFit
- runFlow:
    file: _qs.yaml
    env:
      LABEL: "점수 올리기"
      WAIT: ".*올릴 서류.*"
      SHOT: QsBoost
# The link sheet autofocuses its field, so it goes last and is left open (QsLink).
- runFlow:
    file: _pill.yaml
    env:
      LABEL: "공고 링크로 맞추기"
      DIR: right
- tapOn: "공고 링크로 맞추기"
- extendedWaitUntil:
    visible: "맞추기 시작"
    timeout: 15000
- extendedWaitUntil:
    visible: "복사한 링크"
    timeout: 10000
- waitForAnimationToEnd
# The field autofocuses; the board draws it empty with the keyboard down.
- runFlow: _hide_kbd.yaml
- waitForAnimationToEnd
- takeScreenshot: QsLink
