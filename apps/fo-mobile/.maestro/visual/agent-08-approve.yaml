appId: app.push.mobile
name: 에이전트 · 변경 확인 → 적용 → 프로필 저장 확인 → 완료 → 바로 지원
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _agent_tab.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "모아페이 백엔드 공고에 맞춰 이력서 고쳐 주세요"
      EN: "tailor resume"
- extendedWaitUntil:
    visible: "이 수정을 적용할까요?"
    timeout: 60000
# The approval panel slides up; a tap during the slide can land on 그대로 두기.
- waitForAnimationToEnd
- takeScreenshot: ChatApprove
- tapOn: ".*적용"
- extendedWaitUntil:
    visible: "Push 프로필에 저장했어요. 결과를 확인할까요?"
    timeout: 60000
- runFlow: _chat_bottom.yaml
- takeScreenshot: ChatPh6Result
- tapOn: ".*확인했어요"
# The closing summary streams in below the fold and can stop the follow-the-end scroll (새 내용 pill).
- retry:
    maxRetries: 3
    commands:
      - runFlow: _chat_bottom.yaml
      - extendedWaitUntil:
          visible: ".* 동안 작업했어요"
          timeout: 8000
- waitForAnimationToEnd
- takeScreenshot: ChatDoneProfile
- tapOn: "모아페이에 바로 지원하기"
- extendedWaitUntil:
    visible: "이 공고에 지원해요"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatPh6Apply
