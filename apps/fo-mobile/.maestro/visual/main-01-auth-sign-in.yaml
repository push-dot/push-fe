appId: app.push.mobile
name: 로그인 → 휴대폰 번호 → 인증번호
tags:
  - visual
---
# Signed out, so this tour starts from a cleared launch instead of the dev-token login.
- clearKeychain
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Google로 시작하기"
    timeout: 60000
# The cleared launch shows the LogBox toast over 휴대폰 번호로 시작하기; a tap there opens the debugger.
- runFlow: ../flows/_dismiss_logbox.yaml
- waitForAnimationToEnd
- takeScreenshot: SignIn
- tapOn: "휴대폰 번호로 시작하기"
- extendedWaitUntil:
    visible: "인증번호 받기"
    timeout: 10000
- tapOn: "휴대폰 번호"
- inputText: "01012345678"
- waitForAnimationToEnd
# Shot while the field still has focus (purple border, caret); the pad is dismissed after.
- takeScreenshot: PhoneInputDirect
- runFlow: _hide_kbd.yaml
- tapOn: "인증번호 받기"
- extendedWaitUntil:
    visible: "인증번호를 입력해 주세요"
    timeout: 10000
- inputText: "482"
- runFlow: _hide_kbd.yaml
- waitForAnimationToEnd
- takeScreenshot: PhoneCode
