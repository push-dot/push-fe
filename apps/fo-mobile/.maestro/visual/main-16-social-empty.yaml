appId: app.push.mobile
name: 소셜 → 빈 카테고리
tags:
  - visual
---
# The fixtures have no 소통 posts, which gives the empty state.
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "소셜"
- extendedWaitUntil:
    visible: "직장 생활"
    timeout: 10000
- tapOn: "소통"
- extendedWaitUntil:
    visible: "아직 올라온 글이 없어요"
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: SocialStates.1
