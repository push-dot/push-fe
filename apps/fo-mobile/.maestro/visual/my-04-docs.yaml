appId: app.push.mobile
name: 마이 서류 → 가져오기 시트 → 올린 파일 메뉴·삭제 확인
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "서류"
- extendedWaitUntil:
    visible: "포트폴리오_결제시스템.pdf"
    timeout: 10000
# The 읽는 중 spinner never stops, so do not wait out the full animation timeout.
# (iOS reads each row as one element labelled with its file name, so 읽지 못했어요 is not matchable.)
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: MyResume

- tapOn: "파일 등록"
- extendedWaitUntil:
    visible: "서류 가져오기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: UploadPick
- swipe:
    start: "50%,72%"
    end: "50%,99%"
- extendedWaitUntil:
    notVisible: "서류 가져오기"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000

# The remaining boards are iOS only.
- runFlow:
    when:
      platform: iOS
    commands:
      # The row's own accessibility label hides its ⋯ menu from iOS accessibility, so tap the ⋯ of the first file by position (its row spans 51-60% of the screen).
      - tapOn:
          point: "90%,56%"
      - extendedWaitUntil:
          visible: "서류 삭제하기"
          timeout: 5000
      - waitForAnimationToEnd
      - takeScreenshot: MyResumeStates.1
      - tapOn: "서류 삭제하기"
      - extendedWaitUntil:
          visible: "이 서류를 삭제할까요?"
          timeout: 10000
      - waitForAnimationToEnd
      - takeScreenshot: DeleteDoc.1
      - tapOn: "삭제"
      - extendedWaitUntil:
          visible: "서류를 삭제했어요"
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: DeleteDoc.2
