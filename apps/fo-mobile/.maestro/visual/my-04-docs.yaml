appId: app.push.mobile
name: 마이 서류 → 가져오기 시트 → 올린 파일 메뉴·삭제 확인
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "서류"
- extendedWaitUntil:
    visible: "읽지 못했어요"
    timeout: 10000
# The 읽는 중 spinner never stops, so do not wait out the full animation timeout.
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: MyResume

- tapOn: "파일 등록"
- extendedWaitUntil:
    visible: "서류 가져오기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: UploadPick
# Tap the scrim above the sheet.
- tapOn:
    point: "50%,5%"
- waitForAnimationToEnd:
    timeout: 3000

# The remaining boards are iOS only.
- runFlow:
    when:
      platform: iOS
    commands:
      # shortcut: the row's menu may be hidden from iOS accessibility by the row itself; optional so the tour survives.
      - tapOn:
          text: ".*백엔드_이력서_2026.pdf 더 보기"
          optional: true
      - extendedWaitUntil:
          visible: "서류 삭제하기"
          timeout: 5000
      - waitForAnimationToEnd
      - takeScreenshot: MyResumeStates.1
      - tapOn: "서류 삭제하기"
      - extendedWaitUntil:
          visible: "이 서류를 삭제할까요?"
          timeout: 10000
      - waitForAnimationToEnd
      - takeScreenshot: DeleteDoc.1
      - tapOn: "삭제"
      - extendedWaitUntil:
          visible: "서류를 삭제했어요"
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: DeleteDoc.2
