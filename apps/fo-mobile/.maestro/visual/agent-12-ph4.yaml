appId: app.push.mobile
name: 에이전트 · 품질 검사 → 템플릿 고르기 → PDF 만들기
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _agent_tab.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "좋아요, 계속해 주세요"
      EN: "boost"
- extendedWaitUntil:
    visible: "점수를 한 번 더 올릴까요?"
    timeout: 40000
- waitForAnimationToEnd
- tapOn: ".*여기서 멈추기"
- extendedWaitUntil:
    visible: "추천 수정도 반영할까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh4Quality
- tapOn: "2개 반영하고 디자인으로"
- extendedWaitUntil:
    visible: "검증을 마쳤어요. 어떤 디자인을 적용할까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh4Design
- tapOn: "클래식으로 만들기"
- extendedWaitUntil:
    visible: ".*Push 프로필에 저장하는 중.*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh5
