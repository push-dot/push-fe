appId: app.push.mobile
name: 에이전트 · 품질 검사 → 템플릿 고르기 → PDF 만들기
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _agent_tab.yaml
# ChatPh4Quality draws the quality check right under 품질 검사로 넘어가기, with no boost card above, so the token jumps there.
- runFlow:
    file: _say.yaml
    env:
      KO: "품질 검사로 넘어가기"
      EN: "quality"
- extendedWaitUntil:
    visible: "추천 수정도 반영할까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh4Quality
- tapOn: "2개 반영하고 디자인으로"
- extendedWaitUntil:
    visible: "검증을 마쳤어요. 어떤 디자인을 적용할까요?"
    timeout: 30000
- waitForAnimationToEnd
- tapOn: "프로필 사진 넣기"
- takeScreenshot: ChatPh4Design
# ChatPh5 draws the running save under the 클래식으로 만들기 line alone, so it jumps there in a fresh conversation (the run holds for a minute).
- runFlow: _back_home.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "클래식으로 만들기"
      EN: "ph5"
- extendedWaitUntil:
    visible: ".*Push 프로필에 저장하는 중.*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh5
