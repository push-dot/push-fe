appId: app.push.mobile
name: 소셜 → 글쓰기 시트
tags:
  - visual
---
# Photos need the system picker, so the board's 2/4 shows here as 0/4.
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "소셜"
- extendedWaitUntil:
    visible: "직장 생활"
    timeout: 10000
- tapOn: "글쓰기"
- extendedWaitUntil:
    visible: "새 글"
    timeout: 10000
- tapOn: "카테고리.*"
- tapOn: "커리어"
- waitForAnimationToEnd
- takeScreenshot: ComposeSheet
