appId: app.push.mobile
name: 에이전트 · 적합도 카드 (FREE · ULTRA · 펼침)
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _agent_tab.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "ph1-free"
      EN: "ph1-free"
# The open gate is a modal panel that hides the chat text from accessibility, so wait on its question; the card is on screen above it.
- extendedWaitUntil:
    visible: "이 공고에 맞춰 이력서를 고칠까요?"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatPh1FitFree
- runFlow: _back_home.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "ph1-ultra"
      EN: "ph1-ultra"
- extendedWaitUntil:
    visible: "이 공고에 맞춰 이력서를 고칠까요?"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatPh1FitUltra
# The card cannot be tapped once the gate is up, so a second run holds the gate back (mock token) until the card is open.
- runFlow: _back_home.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "ph1-ultra-open"
      EN: "ph1-ultra-open"
- extendedWaitUntil:
    visible: "이렇게 고치면 8점대"
    timeout: 20000
- tapOn: "이렇게 고치면 8점대"
- extendedWaitUntil:
    visible: ".*정산 도메인 경험을 한 줄 추가하기.*"
    timeout: 5000
- extendedWaitUntil:
    visible: "이 공고에 맞춰 이력서를 고칠까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh1FitUltraOpen
