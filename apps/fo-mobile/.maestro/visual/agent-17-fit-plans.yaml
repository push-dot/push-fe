appId: app.push.mobile
name: 에이전트 · 적합도 카드 (FREE · ULTRA · 펼침)
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _agent_tab.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "ph1-free"
      EN: "ph1-free"
- extendedWaitUntil:
    visible: "PRO로 올리면 항목별 점수와 약점을 볼 수 있어요"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatPh1FitFree
- runFlow: _back_home.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "ph1-ultra"
      EN: "ph1-ultra"
- extendedWaitUntil:
    visible: "이렇게 고치면 8점대"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatPh1FitUltra
- tapOn: "이렇게 고치면 8점대"
- extendedWaitUntil:
    visible: ".*정산 도메인 경험을 한 줄 추가하기.*"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: ChatPh1FitUltraOpen
