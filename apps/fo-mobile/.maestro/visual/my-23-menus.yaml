appId: app.push.mobile
name: 마이 서류 보기 ⋯ 메뉴 → 이름 바꾸기 → 삭제 실패, 내 활동 전체 글 ⋯ 메뉴
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "서류"
- extendedWaitUntil:
    visible: ".*다온뱅크.*"
    timeout: 10000
- tapOn: ".*다온뱅크.*"
- extendedWaitUntil:
    visible: "에이전트로 고치기"
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "더 보기"
- extendedWaitUntil:
    visible: "PDF로 내보내기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: PushDocViewMenuNoDuplicate
- tapOn: "이름 바꾸기"
- extendedWaitUntil:
    visible: "서류 이름 바꾸기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: PushDocRename
- runFlow:
    file: _close_sheet.yaml
    env:
      TITLE: "서류 이름 바꾸기"
- extendedWaitUntil:
    notVisible: "서류 이름 바꾸기"
    timeout: 10000
- tapOn: "뒤로"
- waitForAnimationToEnd

- tapOn: "내 활동"
- extendedWaitUntil:
    visible: "지원한 공고"
    timeout: 10000
- tapOn: "게시글"
- extendedWaitUntil:
    visible: "내가 쓴 글"
    timeout: 10000
- tapOn: ".*전체 보기.*"
- extendedWaitUntil:
    visible: "8개"
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "더 보기"
- extendedWaitUntil:
    visible: "댓글 단 글"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MyPostsAllMenuNoSort

# The archive route fails from the start, so confirming the delete leaves the failure toast on the document.
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=fail:POST:documents/.*/archive"
      READY: "새로 올라온 공고"
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "서류"
- extendedWaitUntil:
    visible: ".*다온뱅크.*"
    timeout: 10000
- tapOn: ".*다온뱅크.*"
- extendedWaitUntil:
    visible: "에이전트로 고치기"
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "더 보기"
- extendedWaitUntil:
    visible: "삭제하기"
    timeout: 10000
- tapOn: "삭제하기"
- extendedWaitUntil:
    visible: "이 서류를 삭제할까요?"
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "삭제"
- runFlow:
    when:
      platform: Android
    file: ../flows/_tap_sheet_button.yaml
    env:
      TEXT: "삭제"
- extendedWaitUntil:
    visible: "서류를 삭제하지 못했어요"
    timeout: 10000
- takeScreenshot: DeleteDocFail
