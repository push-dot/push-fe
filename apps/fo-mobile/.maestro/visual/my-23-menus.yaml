appId: app.push.mobile
name: 마이 서류 보기 ⋯ 메뉴, 내 활동 전체 글 ⋯ 메뉴
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "서류"
- extendedWaitUntil:
    visible: ".*다온뱅크.*"
    timeout: 10000
- tapOn: ".*다온뱅크.*"
- extendedWaitUntil:
    visible: "에이전트로 고치기"
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "더 보기"
- extendedWaitUntil:
    visible: "PDF로 내보내기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: PushDocViewMenu
# Close the menu through the page under it, then leave the doc view.
- tapOn:
    point: "20%,60%"
- waitForAnimationToEnd
- tapOn: "뒤로"
- waitForAnimationToEnd

- tapOn: "내 활동"
- extendedWaitUntil:
    visible: "지원한 공고"
    timeout: 10000
- tapOn: "게시글"
- extendedWaitUntil:
    visible: "내가 쓴 글"
    timeout: 10000
- tapOn: ".*전체 보기.*"
- extendedWaitUntil:
    visible: "8개"
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "더 보기"
- extendedWaitUntil:
    visible: "댓글 단 글"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MyPostsAllMenu
