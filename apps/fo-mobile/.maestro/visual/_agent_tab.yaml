appId: app.push.mobile
tags:
  - subflow
# Enter the 에이전트 tab and accept the reference-data consent (the mock starts with it off).
---
# The first tab tap after login is sometimes dropped (screen stays on 홈); tap until the consent shows.
- retry:
    maxRetries: 3
    commands:
      - tapOn: "에이전트"
      - extendedWaitUntil:
          visible: "동의하고 시작하기"
          timeout: 6000
- tapOn: "동의하고 시작하기"
- extendedWaitUntil:
    notVisible: "동의하고 시작하기"
    timeout: 10000
# On Android the consent sheet sometimes closes back onto 홈 (the tab switch had not landed); tap the tab again then.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible: "공고 링크로 맞추기"
          commands:
            - tapOn: "에이전트"
      - extendedWaitUntil:
          visible: "공고 링크로 맞추기"
          timeout: 10000
- waitForAnimationToEnd
