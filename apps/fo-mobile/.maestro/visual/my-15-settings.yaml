appId: app.push.mobile
name: 마이 설정 → 언어 → 커리어 상태 공개 범위
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "설정"
- extendedWaitUntil:
    visible: ".*Google 계정으로 로그인.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: Settings

# The language picker is a JS popover today and a native menu after the redesign.
- tapOn: "언어 선택.*|한국어"
- extendedWaitUntil:
    visible: "English"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: SettingsLanguage
- tapOn:
    point: "10%,50%"
- waitForAnimationToEnd

- tapOn: "커리어 상태.*"
- extendedWaitUntil:
    visible: ".*커리어 상태를 누가 볼 수 있는지.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: SettingsVisibility
