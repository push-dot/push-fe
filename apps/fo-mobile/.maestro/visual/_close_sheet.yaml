appId: app.push.mobile
tags:
  - subflow
# Closes a native form sheet that has no close button: back on Android, a tap on the dimmed area (then a swipe down) on iOS.
# ${TITLE} is a text that is only on the sheet.
---
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%,6%"
          optional: true
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
      visible: ${TITLE}
    commands:
      - tapOn:
          point: "50%,10%"
          optional: true
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
      visible: ${TITLE}
    commands:
      - swipe:
          start: "50%,45%"
          end: "50%,98%"
          duration: 300
- waitForAnimationToEnd
