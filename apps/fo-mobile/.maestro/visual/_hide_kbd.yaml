appId: app.push.mobile
tags:
  - subflow
# Dismisses the keyboard. iOS hideKeyboard fails ("Couldn't hide the keyboard"), so Return is sent instead:
# the search field has a return key, the phone and code pads are dismissed by the hardware Return event.
---
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
