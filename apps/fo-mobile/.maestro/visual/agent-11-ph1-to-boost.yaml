appId: app.push.mobile
name: 에이전트 · 피드백 → 수정 전략 → 초안 → 초안 검토 → 점수 올리기
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _agent_tab.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "네, 시작해 주세요"
      EN: "analyze"
- extendedWaitUntil:
    visible: "이 공고에 맞춰 이력서를 고칠까요?"
    timeout: 60000
- waitForAnimationToEnd
- tapOn: ".*피드백만 받을게요"
- extendedWaitUntil:
    visible: "피드백을 반영해서 수정할까요?"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatPh1Feedback
- tapOn: ".*반영해서 수정할게요"
- extendedWaitUntil:
    visible: "이 전략대로 초안을 쓸까요?"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh2
- tapOn: ".*초안 쓸게요"
- extendedWaitUntil:
    visible: ".*경력 섹션을 쓰는 중.*"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ChatPh3
- extendedWaitUntil:
    visible: "첫 번째 초안.v1.이에요.*"
    timeout: 40000
- waitForAnimationToEnd
- takeScreenshot: ChatPh3Review
- tapOn: ".*검토할게요"
- extendedWaitUntil:
    visible: "점수를 한 번 더 올릴까요?"
    timeout: 40000
- waitForAnimationToEnd
- takeScreenshot: ChatPh3Boost
