appId: app.push.mobile
name: 마이 설정 → 연락처·말투 시트 → 로그아웃·탈퇴 확인 (취소)
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
# All four boards are iOS only. Neither alert is confirmed: logging out or deleting would end the session.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "설정"
      - extendedWaitUntil:
          visible: ".*Google 계정으로 로그인.*"
          timeout: 10000
      # The boards show the list scrolled to its end, backed off ~30pt (허브 공개 header under the title).
      - runFlow: _settings_end.yaml
      # The boards have 참고 데이터 제공 on (the mock starts it off, so the chat asks first); turn the switch (at 84%,60%) on like a user would.
      - tapOn:
          point: "84%,60%"
      - waitForAnimationToEnd
      - tapOn: "연락처.*"
      - extendedWaitUntil:
          visible: "누구에게 연락처를 보여 줄까요?"
          timeout: 5000
      - waitForAnimationToEnd
      - takeScreenshot: SettingsStates.3
      # These sheets have no 닫기 button of their own (iOS only labels the scrim 팝업 닫기).
      - runFlow:
          file: _close_sheet.yaml
          env:
            TITLE: "누구에게 연락처를 보여 줄까요?"
      - extendedWaitUntil:
          notVisible: "누구에게 연락처를 보여 줄까요?"
          timeout: 5000
      - runFlow: _settings_end.yaml
      - tapOn: "기본 말투.*"
      - extendedWaitUntil:
          visible: "에이전트가 어떤 말투로 쓸까요?"
          timeout: 5000
      - waitForAnimationToEnd
      - takeScreenshot: SettingsStates.4
      - runFlow:
          file: _close_sheet.yaml
          env:
            TITLE: "에이전트가 어떤 말투로 쓸까요?"
      - extendedWaitUntil:
          notVisible: "에이전트가 어떤 말투로 쓸까요?"
          timeout: 5000
      - runFlow: _settings_end.yaml
      - tapOn: "로그아웃"
      # Retap if the alert did not open (dropped first tap, see flows/05_my_settings_logout.yaml).
      - runFlow:
          when:
            notVisible: "취소"
          commands:
            - tapOn: "로그아웃"
      - extendedWaitUntil:
          visible: "로그아웃할까요?"
          timeout: 5000
      - waitForAnimationToEnd
      - takeScreenshot: SettingsStates.1
      - tapOn: "취소"
      - waitForAnimationToEnd
      - tapOn: "회원 탈퇴"
      - extendedWaitUntil:
          visible: "회원 탈퇴할까요?"
          timeout: 5000
      - waitForAnimationToEnd
      - takeScreenshot: SettingsStates.2
      - tapOn: "취소"
