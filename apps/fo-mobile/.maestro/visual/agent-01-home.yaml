appId: app.push.mobile
name: 에이전트 · 동의 → 첫 화면 → 실행 방식 → @언급
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- tapOn: "에이전트"
- extendedWaitUntil:
    visible: "동의하고 시작하기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ChatConsent
- tapOn: "동의하고 시작하기"
- extendedWaitUntil:
    notVisible: "동의하고 시작하기"
    timeout: 10000
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ChatHome
- tapOn: "실행 방식, .*"
- extendedWaitUntil:
    visible: "에이전트가 어떻게 실행할까요?"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: ChatRunMode
# "자동" is the current mode, so choosing it only closes the sheet.
- tapOn: "자동.*"
- extendedWaitUntil:
    notVisible: "에이전트가 어떻게 실행할까요?"
    timeout: 5000
- tapOn: "언급"
- extendedWaitUntil:
    visible: "바로가기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ChatMention
# Android's inputText cannot type Hangul, so the filtered list (ChatEmpty) is iOS only.
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: "모아"
      - extendedWaitUntil:
          notVisible: "바로가기"
          timeout: 5000
      - waitForAnimationToEnd
      - takeScreenshot: ChatEmpty
