appId: app.push.mobile
name: 에이전트 · 동의 → 첫 화면 → 실행 방식 → @언급
tags:
  - visual
---
# few-materials: the @언급 board draws two bookmarks, two documents and one link, so the popover fits above the composer.
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=few-materials"
      READY: "새로 올라온 공고"
# The first tab tap after login is sometimes dropped (screen stays on 홈); tap until the consent shows.
- retry:
    maxRetries: 3
    commands:
      - tapOn: "에이전트"
      - extendedWaitUntil:
          visible: "동의하고 시작하기"
          timeout: 6000
- waitForAnimationToEnd
- takeScreenshot: ChatConsent
- tapOn: "동의하고 시작하기"
- extendedWaitUntil:
    notVisible: "동의하고 시작하기"
    timeout: 10000
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ChatHome
- tapOn: "실행 방식, .*"
- extendedWaitUntil:
    visible: "에이전트가 어떻게 실행할까요?"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: ChatRunMode
# "자동" is the current mode, so choosing it only closes the sheet.
- tapOn: "자동.*"
- extendedWaitUntil:
    notVisible: "에이전트가 어떻게 실행할까요?"
    timeout: 5000
- tapOn: "언급"
# 바로가기 is the last group, below the popover's scroll fold, so wait on the first group.
- extendedWaitUntil:
    visible: "북마크 공고"
    timeout: 10000
# The board draws the keyboard down with the tab bar back; the popover then grows to its full height.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard:
          optional: true
      - extendedWaitUntil:
          visible: "바로가기"
          timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: ChatMention
# Android's inputText cannot type Hangul, so the filtered list (ChatEmpty) is iOS only.
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: "모아"
      # 라온헬스's bookmark does not contain "모아", so its row leaves the list.
      - extendedWaitUntil:
          notVisible: "북마크 공고, 안드로이드 개발자"
          timeout: 5000
      - waitForAnimationToEnd
      - takeScreenshot: ChatEmpty
