appId: app.push.mobile
name: 채용공고 목록 → 경력 · 직군 필터
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _open_jobs.yaml
- extendedWaitUntil:
    visible: ".*모아페이.*"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: JobList
# Each sheet is shot with its draft picked and the list still unfiltered behind it, like the boards.
- tapOn: "경력"
- tapOn: "4.6년"
- extendedWaitUntil:
    visible: "공고 386개 보기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: HomeFilter
- runFlow:
    file: ../flows/_tap_sheet_button.yaml
    env:
      TEXT: "공고 386개 보기"
- tapOn: "전체"
- waitForAnimationToEnd
- tapOn: "직군"
- tapOn: "개발"
- tapOn: "데이터"
- extendedWaitUntil:
    visible: "공고 512개 보기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: FilterRole
