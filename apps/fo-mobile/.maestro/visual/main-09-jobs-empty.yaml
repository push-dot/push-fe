appId: app.push.mobile
name: 채용공고 → 조건에 맞는 공고 없음
tags:
  - visual
---
# 개발 + 4–6년 + 대전 유성구 matches nothing in the fixtures (the app has no 제주 region to pick).
- runFlow: ../flows/_login.yaml
- runFlow: _open_jobs.yaml
- tapOn: "직군"
- tapOn: "개발"
- waitForAnimationToEnd
- runFlow:
    file: ../flows/_tap_sheet_button.yaml
    env:
      TEXT: "공고 .*개 보기"
- tapOn: "경력.*"
- tapOn: "4.6년"
- waitForAnimationToEnd
- runFlow:
    file: ../flows/_tap_sheet_button.yaml
    env:
      TEXT: "공고 .*개 보기"
- runFlow: _scroll_chips.yaml
- tapOn: "지역"
- tapOn: "대전"
- tapOn: "유성구(.*28)?"
- waitForAnimationToEnd
- runFlow:
    file: ../flows/_tap_sheet_button.yaml
    env:
      TEXT: "공고 0개 보기"
- extendedWaitUntil:
    visible: ".*조건에 맞는 공고가 없어요.*"
    timeout: 10000
# The board's bar sits at its start (전체 first); picking 지역 left it scrolled right.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "10%,17%"
          end: "90%,17%"
          duration: 300
- waitForAnimationToEnd
- takeScreenshot: JobListEmpty.1
- takeScreenshot: JobListEmpty.2
