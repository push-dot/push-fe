appId: app.push.mobile
name: 마이 내 활동 → 빈 지원활동·북마크·팔로우·게시글
tags:
  - visual
---
# The rules must be set before 내 활동 first loads each list (the queries cache for 30s); the link lands on the social tab, which asks for none of them.
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- openLink: push://social?mock=empty:GET:applications$,empty:GET:me/bookmarks,empty:GET:me/follows$,empty:GET:me/posts$
- extendedWaitUntil:
    visible: "직장 생활"
    timeout: 10000
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "내 활동"
- extendedWaitUntil:
    visible: "아직 지원한 공고가 없어요."
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: MyActivityEmpty.1

- tapOn: "북마크"
- extendedWaitUntil:
    visible: "북마크한 공고가 없어요."
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: MyActivityEmpty.2

- tapOn: "팔로우"
- extendedWaitUntil:
    visible: "아직 팔로우한 사람이 없어요."
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: MyActivityEmpty.3

- tapOn: "게시글"
- extendedWaitUntil:
    visible: "아직 쓴 글이 없어요."
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: MyActivityEmpty.4

- openLink: push://social?mock=reset
