appId: app.push.mobile
name: 마이 서류 → 등록한 서류 없음
tags:
  - visual
---
# The 서류 tab is empty only when both its lists (uploaded sources and push documents) are; set the rules before it first loads.
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- openLink: push://social?mock=empty:GET:sources$,empty:GET:documents$
- extendedWaitUntil:
    visible: "직장 생활"
    timeout: 10000
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "서류"
- extendedWaitUntil:
    visible: "아직 등록한 서류가 없어요"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MyResumeEmpty

- openLink: push://social?mock=reset
