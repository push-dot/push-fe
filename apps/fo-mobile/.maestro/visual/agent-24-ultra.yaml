appId: app.push.mobile
name: 에이전트 · ULTRA 요금제 · 크레딧을 다 쓴 ULTRA
tags:
  - visual
---
# plan-ultra makes GET chat/account an ULTRA account; credits-out spends every credit, so the next message answers with the usage card.
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=plan-ultra,credits-out"
      READY: "새로 올라온 공고"
- runFlow: _agent_tab.yaml
- tapOn: "대화 목록 열기"
- extendedWaitUntil:
    visible: "최근 대화"
    timeout: 10000
- tapOn: ".*계정 열기"
- extendedWaitUntil:
    visible: "에이전트가 참고하는 내 정보"
    timeout: 10000
- tapOn: "ULTRA"
- extendedWaitUntil:
    visible: "요금제마다.*"
    timeout: 5000
- extendedWaitUntil:
    visible: "지금 ULTRA를 쓰고 있어요"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: PlanUltra
- tapOn: "뒤로"
- tapOn: "닫기"
- extendedWaitUntil:
    visible: "공고 링크로 맞추기"
    timeout: 10000
- runFlow:
    file: _say.yaml
    env:
      KO: "모아페이 공고에 맞춰 경력기술서도 써 줘"
      EN: "write cover letter"
- extendedWaitUntil:
    visible: "이번 달 사용량을 다 썼어요.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatNoCreditUltra
- openLink: push://?mock=reset
