appId: app.push.mobile
tags:
  - subflow
# The 설정 list scrolled to its end and backed off ~30pt (the boards' scroll); the list returns to the top after a sheet closes, so repeat it before each tap.
---
- repeat:
    times: 3
    commands:
      - swipe:
          start: "50%,85%"
          end: "50%,15%"
- waitForAnimationToEnd
- swipe:
    start: "50%,50%"
    end: "50%,54%"
    duration: 1000
- waitForAnimationToEnd
