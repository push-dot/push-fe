appId: app.push.mobile
name: 마이 프로필 → 기본 정보·소개·기술 스택 편집
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- extendedWaitUntil:
    visible: "경력 편집"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MyProfile

- tapOn: "기본 정보 편집"
- extendedWaitUntil:
    visible: ".*제안 받기.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: EditProfileBasic
- tapOn: "닫기"

- tapOn: "소개 편집"
- extendedWaitUntil:
    visible: "에이전트로 다듬기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: EditIntro
- tapOn: "닫기"

# The skills section ends under the tab bar even at the bottom of the scroll, so on iOS tap the strip of its pencil above the bar.
- scroll
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "91%,90%"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "기술 스택 편집"
- extendedWaitUntil:
    visible: ".*내 기술 .*개.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: EditSkills
