appId: app.push.mobile
name: 에이전트 · 큰 글씨 · 작업 중 + 대기 중인 말
tags:
  - visual
---
- runFlow: ../../flows/_login.yaml
- runFlow: ../_agent_tab.yaml
- runFlow:
    file: ../_say.yaml
    env:
      KO: "모아페이 백엔드 공고에 맞춰 이력서 고쳐 주세요"
      EN: "tailor hold"
- extendedWaitUntil:
    visible: ".*기술 스택을 비교하는 중.*"
    timeout: 40000
- runFlow:
    file: ../_say.yaml
    env:
      KO: "경력은 숫자 위주로 써 주세요"
      EN: "use numbers"
- extendedWaitUntil:
    visible: ".*대기 중.*"
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: ChatXL.1
- runFlow:
    when:
      platform: Android
    commands:
      - takeScreenshot: ChatXL.2
