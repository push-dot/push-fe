appId: app.push.mobile
name: 홈 · 큰 글씨
tags:
  - visual
---
# Run with the system text size raised (xl/ is a separate run).
- runFlow: ../../flows/_login.yaml
- extendedWaitUntil:
    visible: ".*모아페이.*"
    timeout: 20000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: MainXL.1
- runFlow:
    when:
      platform: Android
    commands:
      - takeScreenshot: MainXL.2
