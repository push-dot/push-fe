appId: app.push.mobile
name: 마이 서류 → 올린 파일 → 에이전트로 고치기
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "서류"
- extendedWaitUntil:
    visible: "김서준_백엔드_이력서_2026.pdf"
    timeout: 10000
- tapOn: "김서준_백엔드_이력서_2026.pdf"
- extendedWaitUntil:
    visible: "에이전트로 고치기"
    timeout: 10000
- tapOn: "에이전트로 고치기"
# The mock starts with the reference-data consent off, so the chat opens behind its sheet.
- extendedWaitUntil:
    visible: "동의하고 시작하기"
    timeout: 10000
- tapOn: "동의하고 시작하기"
- extendedWaitUntil:
    notVisible: "동의하고 시작하기"
    timeout: 10000
- extendedWaitUntil:
    visible: ".*이 서류를 고쳐 줘.*"
    timeout: 15000
# The mock holds the first read (no todo yet) for a minute, so the board's 서류를 읽는 중 line is on screen.
- extendedWaitUntil:
    visible: ".*서류를 읽는 중.*"
    timeout: 10000
- takeScreenshot: DocAgentNew
