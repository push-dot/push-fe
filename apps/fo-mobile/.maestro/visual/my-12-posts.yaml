appId: app.push.mobile
name: 마이 내 활동 → 게시글 → 전체 보기 → 게시글 상세
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "내 활동"
- extendedWaitUntil:
    visible: "지원한 공고"
    timeout: 10000
- tapOn: "게시글"
- extendedWaitUntil:
    visible: "내가 쓴 글"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MyPosts

- tapOn: ".*전체 보기.*"
- extendedWaitUntil:
    visible: "8개"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MyPostsAll

# The detail comes from social.ts, which needs the my post ids.
- tapOn: ".*연봉 협상 전에.*"
- extendedWaitUntil:
    visible: ".*답글 달기.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MyPostDetail
