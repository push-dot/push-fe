appId: app.push.mobile
name: 허브 → 필터 시트 → 필터 적용 → 빈 상태
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- tapOn: "허브"
- extendedWaitUntil:
    visible: "추천 프로필"
    timeout: 10000
- extendedWaitUntil:
    visible: ".*김태윤.*"
    timeout: 10000
- tapOn: "개발"
- tapOn: "데이터"
- tapOn: "필터"
- extendedWaitUntil:
    visible: "재직 기간"
    timeout: 10000
- tapOn: "3.5년"
# Android keeps the list's 이직/구직중 badges behind the sheet (a tap on one hits the scrim and closes it), so anchor under the group title.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "이직/구직중"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "이직/구직중"
          below: "커리어 상태"
- extendedWaitUntil:
    visible: "프로필 46개 보기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: HubFilter
- runFlow:
    file: ../flows/_tap_sheet_button.yaml
    env:
      TEXT: "프로필 46개 보기"
- extendedWaitUntil:
    visible: ".*김태윤.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: Hub
# 개발·데이터 with 10년+ has no one in the fixtures.
- tapOn: "필터.*"
- extendedWaitUntil:
    visible: "재직 기간"
    timeout: 10000
- tapOn: "3.5년"
- tapOn: "10년\\+"
- waitForAnimationToEnd
- runFlow:
    file: ../flows/_tap_sheet_button.yaml
    env:
      TEXT: "프로필 .*개 보기"
- extendedWaitUntil:
    visible: "조건에 맞는 프로필이 없어요."
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: HubEmpty.1
- takeScreenshot: HubEmpty.2
