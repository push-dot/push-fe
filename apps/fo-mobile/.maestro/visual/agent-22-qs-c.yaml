appId: app.push.mobile
name: 에이전트 · 빠른 시작 시트 (경험 · 답장 · 커피챗 · 글)
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _agent_tab.yaml
- runFlow:
    file: _qs.yaml
    env:
      LABEL: "경험 만들기"
      WAIT: "직접 입력하기"
      SHOT: QsExp
- runFlow:
    file: _qs.yaml
    env:
      LABEL: "제안 답장 쓰기"
      WAIT: ".*결제 플랫폼팀 시니어 포지션으로.*"
      SHOT: QsReply
- runFlow:
    file: _qs.yaml
    env:
      LABEL: "커피챗 제안 쓰기"
      WAIT: ".*김태윤.*"
      SHOT: QsCoffee
- runFlow:
    file: _qs.yaml
    env:
      LABEL: "커리어 글 쓰기"
      WAIT: "직접 주제 정하기"
      SHOT: QsPost
