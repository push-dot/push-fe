appId: app.push.mobile
name: 마이 캘린더 → Google 연결 안 됨·빈 날 → 일정 추가 시트
tags:
  - visual
---
# calendar() reads a failed integrations/google as not connected; set the rule before the calendar first loads.
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- openLink: push://social?mock=fail:GET:integrations/google
- extendedWaitUntil:
    visible: "직장 생활"
    timeout: 10000
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "내 활동"
- extendedWaitUntil:
    visible: "지원한 공고"
    timeout: 10000
- tapOn: "캘린더"
- extendedWaitUntil:
    visible: "Google 연결 안 됨"
    timeout: 10000
# The mock events are all in October 2026 and the calendar opens on the device's month, so step back from November.
- runFlow:
    when:
      visible: "2026년 11월"
    commands:
      - tapOn: "이전 달"
- extendedWaitUntil:
    visible: ".*일정 .*개.*"
    timeout: 10000
# 10월 23일 has no event; the board selects it.
- tapOn: ".*10월 23일.*"
- extendedWaitUntil:
    visible: "이날은 일정이 없어요."
    timeout: 10000
- extendedWaitUntil:
    visible: "Google 연결 안 됨"
    timeout: 10000
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: MyCalendarStates.2
      # "일정 추가" is the + button; "일정 추가하기" is the sheet's own submit button.
      - tapOn: "일정 추가"
      - extendedWaitUntil:
          visible: "어떤 일정을 추가할까요?"
          timeout: 10000
      - waitForAnimationToEnd
      - takeScreenshot: MyCalendarStates.1

- openLink: push://social?mock=reset
