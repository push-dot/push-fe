appId: app.push.mobile
name: 에이전트 · 작업 중 + 대기 중인 말
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _agent_tab.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "모아페이 백엔드 공고에 맞춰 이력서 고쳐 주세요"
      EN: "tailor resume"
- extendedWaitUntil:
    visible: ".*기술 스택을 비교하는 중.*"
    timeout: 40000
- runFlow:
    file: _say.yaml
    env:
      KO: "경력은 숫자 위주로 써 주세요"
      EN: "use numbers"
- extendedWaitUntil:
    visible: ".*대기 중.*"
    timeout: 10000
- runFlow:
    file: _chat_kbd_down.yaml
    env:
      TEXT: ".*맞춤 초안을 만들어 볼게요.*"
- takeScreenshot: ChatWorking
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: ChatStates.3
