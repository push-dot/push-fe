appId: app.push.mobile
tags:
  - subflow
# Long-press the row titled ${TITLE} in the list modal and delete it.
---
- longPressOn: ".*${TITLE}.*"
- extendedWaitUntil:
    visible: "이름 바꾸기"
    timeout: 5000
- tapOn: "삭제"
- extendedWaitUntil:
    visible: "대화를 삭제할까요?"
    timeout: 5000
- tapOn: "삭제"
- extendedWaitUntil:
    notVisible: "대화를 삭제할까요?"
    timeout: 5000
- waitForAnimationToEnd
