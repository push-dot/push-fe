appId: app.push.mobile
tags:
  - subflow
# Signed-out launch -> phone number -> the 인증번호 screen with the keyboard still up.
---
- clearKeychain
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "휴대폰 번호로 시작하기"
    timeout: 60000
# The first tap after a cleared launch is sometimes dropped (screen stays on sign-in); tap until the form shows.
- retry:
    maxRetries: 3
    commands:
      - tapOn: "휴대폰 번호로 시작하기"
      - extendedWaitUntil:
          visible: "인증번호 받기"
          timeout: 6000
- tapOn: "휴대폰 번호"
- inputText: "01012345678"
- runFlow: _hide_kbd.yaml
- tapOn: "인증번호 받기"
- extendedWaitUntil:
    visible: "인증번호를 입력해 주세요"
    timeout: 10000
