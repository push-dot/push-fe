appId: app.push.mobile
tags:
  - subflow
# Applies a tall filter sheet (지역, 기술 스택). On iOS the sheet's button is cut off by the screen bottom (only y 843-865 of 874 shows),
# so a tap at its hierarchy center lands below the sheet and dismisses it unapplied: tap the visible strip instead.
# Maestro takes whole percents only ("97.5%" fails to parse), 98% is the middle of the strip.
# Needs ${TEXT}, the button's label.
---
- extendedWaitUntil:
    visible: ${TEXT}
    timeout: 10000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%,98%"
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          file: ../flows/_tap_sheet_button.yaml
          env:
            TEXT: ${TEXT}
