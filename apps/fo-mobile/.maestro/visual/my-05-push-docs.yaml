appId: app.push.mobile
name: 마이 서류 → Push 서류 전체 → 서류 보기
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "서류"
- extendedWaitUntil:
    visible: "전체 5개 보기"
    timeout: 10000
- tapOn: "전체 5개 보기"
- extendedWaitUntil:
    visible: "5개"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: PushDocs
# Below the count, so the carousel card behind a page sheet is not the one tapped.
- tapOn:
    text: ".*다온뱅크.*"
    below: "5개"
- extendedWaitUntil:
    visible: "에이전트로 고치기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: PushDocViewModal
