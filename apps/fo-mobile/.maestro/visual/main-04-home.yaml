appId: app.push.mobile
name: 홈 → 스크롤 → 마감 임박 전체보기
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- extendedWaitUntil:
    visible: ".*모아페이.*"
    timeout: 20000
- extendedWaitUntil:
    visible: "마감 임박 공고"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: Main
# About a third of the screen: the board scrolls past the shortcuts so 마감 임박 공고 sits near the top.
- swipe:
    start: 50%, 70%
    end: 50%, 37%
    duration: 1200
- waitForAnimationToEnd
- takeScreenshot: HomeScrolled
- tapOn: "마감 임박 공고 전체보기"
- extendedWaitUntil:
    visible: "일주일 안에 마감되는 공고예요"
    timeout: 10000
- extendedWaitUntil:
    visible: ".*파도AI.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: SectionAll
