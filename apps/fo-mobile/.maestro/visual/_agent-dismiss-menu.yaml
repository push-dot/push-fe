appId: app.push.mobile
tags:
  - subflow
# Closes the conversation ⋯ menu without choosing anything. On iOS the menu drops down over the top-right
# (to about y=39%), so _dismiss_menu's tap at 50%,12% lands on 이름 바꾸기; tap the free area to its left instead.
---
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "15%,55%"
- waitForAnimationToEnd
