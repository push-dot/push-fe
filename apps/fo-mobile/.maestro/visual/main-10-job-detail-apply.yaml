appId: app.push.mobile
name: 공고 상세 → 지원 서류 → 지원 완료
tags:
  - visual
---
# The detail body is the fo-web page in a WebView; its mock fit card is the PRO state.
- runFlow: ../flows/_login.yaml
- runFlow: _open_jobs.yaml
- extendedWaitUntil:
    visible: ".*모아페이.*"
    timeout: 15000
- tapOn:
    text: ".*모아페이.*"
    index: 0
- extendedWaitUntil:
    visible: "지원하기"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*조금만 고치면 8점대예요.*"
    timeout: 30000
    optional: true
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - takeScreenshot: JobDetail.4
      - takeScreenshot: JobDetail.5
- runFlow:
    when:
      platform: Android
    commands:
      - takeScreenshot: JobDetail.6
- tapOn: "지원하기"
- extendedWaitUntil:
    visible: "어떤 서류로 지원할까요?"
    timeout: 10000
- extendedWaitUntil:
    visible: ".*김서준_백엔드_이력서_2026.*"
    timeout: 10000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ApplySheet
- runFlow:
    file: ../flows/_tap_sheet_button.yaml
    env:
      TEXT: "이 서류로 지원하기"
- extendedWaitUntil:
    visible: "지원 완료"
    timeout: 10000
- takeScreenshot: Applied
