appId: app.push.mobile
name: 마이 설정 → 혜택·이벤트 알림 → 약관 및 정책
tags:
  - visual
---
# No artboards: the marketing switch (D12) and the 약관 및 정책 screen are new; the shots are the iOS light evidence.
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "설정"
- extendedWaitUntil:
    visible: ".*Google 계정으로 로그인.*"
    timeout: 10000
- scrollUntilVisible:
    element: "혜택·이벤트 알림"
    direction: DOWN
- tapOn:
    text: "혜택·이벤트 알림"
    index: 1
- extendedWaitUntil:
    visible: ".*Push 혜택·이벤트 알림을 받기로 했어요"
    timeout: 5000
- takeScreenshot: SettingsMarketingOn
- runFlow: _settings_end.yaml
- tapOn: "약관 및 정책"
- extendedWaitUntil:
    visible: "제1조 (목적)"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: LegalTerms
- tapOn: "개인정보 처리방침"
- extendedWaitUntil:
    visible: "1. 수집하는 개인정보"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: LegalPrivacy
