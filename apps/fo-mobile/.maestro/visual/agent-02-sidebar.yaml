appId: app.push.mobile
name: 에이전트 · 사이드바 → 계정 → 요금제 → 내 서류 → 북마크한 공고
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _agent_tab.yaml
- tapOn: "대화 목록 열기"
- extendedWaitUntil:
    visible: "최근 대화"
    timeout: 10000
- extendedWaitUntil:
    visible: ".*파도AI 자기소개서 초안.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ChatDrawer
- tapOn: ".*계정 열기"
- extendedWaitUntil:
    visible: "에이전트가 참고하는 내 정보"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ChatAccount
- tapOn: "PRO"
- extendedWaitUntil:
    visible: "요금제마다.*"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: PlanUpgrade
- tapOn: "뒤로"
- tapOn: "닫기"
- waitForAnimationToEnd
- tapOn: "내 서류"
- extendedWaitUntil:
    visible: "PDF, DOCX 파일을 20MB까지.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ChatDocs
- tapOn: "닫기"
- waitForAnimationToEnd
- tapOn: "북마크한 공고"
- extendedWaitUntil:
    visible: "공고를 누르면 상세를 보거나.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ChatBookmarks
