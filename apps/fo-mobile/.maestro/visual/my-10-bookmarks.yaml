appId: app.push.mobile
name: 마이 내 활동 → 북마크 → 공고 상세
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "내 활동"
- extendedWaitUntil:
    visible: "지원한 공고"
    timeout: 10000
- tapOn: "북마크"
- extendedWaitUntil:
    visible: "북마크한 공고"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MyBookmarks

- tapOn: ".*모아페이.*"
- extendedWaitUntil:
    visible: "지원하기"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: MyBookmarkJob
