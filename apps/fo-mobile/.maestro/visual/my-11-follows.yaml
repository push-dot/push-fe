appId: app.push.mobile
name: 마이 내 활동 → 팔로우 → 전체 보기 → 프로필
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "내 활동"
- extendedWaitUntil:
    visible: "지원한 공고"
    timeout: 10000
- tapOn: "팔로우"
- extendedWaitUntil:
    visible: ".*전체 보기.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MyFollows

- tapOn: ".*전체 보기.*"
- extendedWaitUntil:
    visible: "이름이나 직무로 찾기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MyFollowingAll

- tapOn: ".*이하은.*"
- extendedWaitUntil:
    visible: ".*Storybook.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: MyFollowingProfile
