appId: app.push.mobile
name: 마이 서류 → 올린 파일 보기 → 프로필로 전환 → 기본 프로필 설정
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "서류"
- extendedWaitUntil:
    visible: "김서준_백엔드_이력서_2026.pdf"
    timeout: 10000
- tapOn: "김서준_백엔드_이력서_2026.pdf"
- extendedWaitUntil:
    visible: "내 프로필로 전환"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: DocViewer

- tapOn: "내 프로필로 전환"
- extendedWaitUntil:
    visible: "이 이력서로 프로필을 채울까요?"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: DocToProfile

# Applying the picked sections lands on the 프로필 tab; the 지원 서류용 프로필 detail only opens from the chat result card.
- tapOn: "3개 항목 반영하기"
- extendedWaitUntil:
    visible: "기본 정보 편집"
    timeout: 15000
- runFlow: _agent_tab.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "ext-done"
      EN: "ext-done"
- extendedWaitUntil:
    visible: ".* 동안 작업했어요"
    timeout: 30000
- tapOn: "프로필로 전환"
- extendedWaitUntil:
    visible: "기본 프로필로 설정"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: DocProfile

- tapOn: "기본 프로필로 설정"
- extendedWaitUntil:
    visible: "이 프로필을 기본 프로필로 설정할까요?"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: DocProfileConfirm

- tapOn: "설정"
- extendedWaitUntil:
    visible: ".*기본 프로필로 설정했어요.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: DocProfileDone
