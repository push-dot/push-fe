appId: app.push.mobile
name: 마이 제안 ⋯ 메뉴 → 보관·차단 → 보관한 제안 → 보낼 수 없는 대화·제안
tags:
  - visual
---
# ProposalInbox (with 보관한 제안 1개 and the note) is captured by my-13-offers.yaml; the mock seeds one archived offer, so that row is already on it.
# The ⋯ menu is a UIMenu on iOS: tap the button by its label, then the item text.
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "받은 제안 .*개"
- extendedWaitUntil:
    visible: ".*오지현.*"
    timeout: 10000
- tapOn: ".*오지현.*"
- extendedWaitUntil:
    visible: "수락하고 답장하기"
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "더 보기"
- extendedWaitUntil:
    visible: "제안 보관하기"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ProposalDetailMenu

# Toasts disappear: shoot as soon as the text is up.
- tapOn: "제안 보관하기"
- extendedWaitUntil:
    visible: "제안을 보관했어요"
    timeout: 10000
- takeScreenshot: ProposalToastArchived
- tapOn: "되돌리기"
- extendedWaitUntil:
    visible: ".*오지현.*"
    timeout: 10000

- tapOn: ".*오지현.*"
- extendedWaitUntil:
    visible: "수락하고 답장하기"
    timeout: 10000
- waitForAnimationToEnd
# Reporting stays on the offer; the toast sits above the bottom buttons.
- tapOn: "더 보기"
- extendedWaitUntil:
    visible: "신고하기"
    timeout: 10000
- tapOn: "신고하기"
- extendedWaitUntil:
    visible: "신고가 접수됐어요"
    timeout: 10000
- takeScreenshot: ProposalToastReported
- extendedWaitUntil:
    notVisible: "신고가 접수됐어요"
    timeout: 10000
- tapOn: "더 보기"
- extendedWaitUntil:
    visible: "차단하기"
    timeout: 10000
- tapOn: "차단하기"
- extendedWaitUntil:
    visible: "오지현 님을 차단할까요?"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ProposalBlockConfirm
- tapOn: "차단"
- extendedWaitUntil:
    visible: "오지현 님을 차단했어요"
    timeout: 10000
- takeScreenshot: ProposalToastBlocked

# Blocking 오지현 leaves 3 received offers and the one archived offer.
- tapOn: "보관한 제안.*"
- extendedWaitUntil:
    visible: "보관한 제안은 받은 제안 목록과 알림에서 빠져요.*"
    timeout: 10000
- extendedWaitUntil:
    visible: ".*누리클라우드 채용팀.*"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ProposalArchived

# An archived offer offers 보관 풀기 (not drawn) and stays on the detail afterwards.
- tapOn: ".*누리클라우드 채용팀.*"
- extendedWaitUntil:
    visible: "수락하고 답장하기"
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "더 보기"
- extendedWaitUntil:
    visible: "보관 풀기"
    timeout: 10000
- tapOn: "보관 풀기"
- waitForAnimationToEnd
- assertVisible: "수락하고 답장하기"
- tapOn: "더 보기"
- extendedWaitUntil:
    visible: "제안 보관하기"
    timeout: 10000
- assertNotVisible: "보관 풀기"
- runFlow: _agent-dismiss-menu.yaml
- tapOn: "뒤로"
- extendedWaitUntil:
    notVisible: ".*누리클라우드 채용팀.*"
    timeout: 10000

# A fresh session where 오지현 and 최지우 blocked the viewer.
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=blocked-by-them"
      READY: "새로 올라온 공고"
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- tapOn: "받은 제안 .*개"
- extendedWaitUntil:
    visible: ".*오지현.*"
    timeout: 10000
- tapOn: ".*오지현.*"
- extendedWaitUntil:
    visible: "수락하고 답장하기"
    timeout: 10000
- tapOn: "수락하고 답장하기"
- extendedWaitUntil:
    visible: "어떻게 답장할까요?"
    timeout: 10000
# Android inputText is ASCII only, so it pastes the board's Korean text from the clipboard.
- tapOn: "답장.*"
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: "제안 감사해요, 지현 님! 다음 주 화요일이나 목요일 저녁이면 좋아요."
- runFlow:
    when:
      platform: Android
    commands:
      - setClipboard: "제안 감사해요, 지현 님! 다음 주 화요일이나 목요일 저녁이면 좋아요."
      - pasteText
- tapOn: "수락하고 보내기"
- extendedWaitUntil:
    visible: ".*목요일 저녁 7시.*"
    timeout: 20000
- tapOn: "메시지.*"
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: "좋아요. 그때 뵐게요!"
- runFlow:
    when:
      platform: Android
    commands:
      - setClipboard: "좋아요. 그때 뵐게요!"
      - pasteText
- tapOn: "보내기"
- extendedWaitUntil:
    visible: "이 대화에는 더 이상 메시지를 보낼 수 없어요."
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ProposalChatUnavailable

# The hub offer sheet refuses a person who blocked the viewer (not drawn).
- runFlow:
    file: _login_mock.yaml
    env:
      MOCK: "push://sign-in?mock=blocked-by-them"
      READY: "새로 올라온 공고"
- tapOn: "허브"
- extendedWaitUntil:
    visible: "추천 프로필"
    timeout: 10000
- scrollUntilVisible:
    element: ".*최지우.*"
- tapOn: ".*최지우.*"
- extendedWaitUntil:
    visible: "제안하기"
    timeout: 20000
- tapOn: "제안하기"
- extendedWaitUntil:
    visible: ".*최지우 님에게.*"
    timeout: 10000
- tapOn: ".*어떤 이야기를 나누고 싶은지 적어 주세요"
- inputText: "Coffee chat?"
- tapOn: ".*최지우 님에게.*"
- runFlow:
    file: ../flows/_tap_sheet_button.yaml
    env:
      TEXT: "제안 보내기"
- extendedWaitUntil:
    visible: "지금은 이 사람에게 제안을 보낼 수 없어요."
    timeout: 10000
