appId: app.push.mobile
name: 마이 프로필 → 경력 삭제 확인
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: ../flows/_dismiss_logbox.yaml
- tapOn: "마이"
- extendedWaitUntil:
    visible: "김서준"
    timeout: 10000
- extendedWaitUntil:
    visible: "경력 편집"
    timeout: 10000
# Both boards are iOS only; nothing is saved, the toast's 되돌리기 is left alone.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "경력 편집"
      - extendedWaitUntil:
          visible: "이 경력 삭제하기"
          timeout: 10000
      - tapOn: "이 경력 삭제하기"
      - extendedWaitUntil:
          visible: "이 경력을 삭제할까요?"
          timeout: 10000
      - waitForAnimationToEnd
      - takeScreenshot: DeleteCareer.1
      - tapOn: "삭제"
      - extendedWaitUntil:
          visible: "경력을 삭제했어요"
          timeout: 10000
      - waitForAnimationToEnd
      - takeScreenshot: DeleteCareer.2
