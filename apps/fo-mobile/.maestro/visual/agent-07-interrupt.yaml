appId: app.push.mobile
name: 에이전트 · 작업 중 중지 → 다시 요청
tags:
  - visual
---
- runFlow: ../flows/_login.yaml
- runFlow: _agent_tab.yaml
- runFlow:
    file: _say.yaml
    env:
      KO: "모아페이 백엔드 공고에 맞춰 이력서 고쳐 주세요"
      EN: "tailor resume"
- extendedWaitUntil:
    visible: ".*기술 스택을 비교하는 중.*"
    timeout: 40000
- tapOn: "중지"
- extendedWaitUntil:
    visible: ".*중단됨.*"
    timeout: 5000
- runFlow:
    file: _say.yaml
    env:
      KO: "잠깐, 자기소개서도 같이 써 줘"
      EN: "wait also write cover letter"
- extendedWaitUntil:
    visible: ".*경력 수준을 비교하는 중.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ChatInterrupt
