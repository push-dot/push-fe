<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Push</title>
    <!-- --font-sans (@push/design-system) starts with Noto Sans KR; most desktops do not ship it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400..800&display=swap" />
    <script>
      ;(function () {
        var key = 'push-theme'
        var theme = new URLSearchParams(location.search).get('theme')
        var valid = theme === 'light' || theme === 'dark'
        try {
          if (!window.ReactNativeWebView) {
            if (valid) localStorage.setItem(key, theme)
            else theme = localStorage.getItem(key)
          }
        } catch (e) {}
        if (!document.documentElement.hasAttribute('data-theme') && (theme === 'light' || theme === 'dark')) {
          document.documentElement.dataset.theme = theme
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
