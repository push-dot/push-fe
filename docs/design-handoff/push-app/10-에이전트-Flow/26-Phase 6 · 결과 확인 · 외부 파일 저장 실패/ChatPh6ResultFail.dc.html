<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Phase 6 · 바로 지원 확인</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&amp;family=Noto+Sans+Symbols+2&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.and .ai-in{background:var(--bg2)}.ios .ai-in{box-shadow:var(--glassShadow)}
.ncomp{position:absolute;left:12px;right:12px;z-index:4;display:flex;flex-direction:column;gap:8px}
.ncomp .nbox{border-radius:28px;padding:16px 10px 10px 18px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.ncomp .rb{width:40px;height:40px;border-radius:20px;background:var(--fill);display:flex;align-items:center;justify-content:center;flex:none;color:var(--t1)}
.ncomp .mb{height:40px;padding:0 14px;border-radius:20px;background:var(--fill);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.ph div[style*="flex-direction: column"][style*="overflow: hidden"]>*{flex-shrink:0}
.ph{font-family:Pretendard,"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.02em;color:var(--t1);background:var(--bg);position:relative;width:390px;height:844px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 24px 60px rgba(0,0,0,.14)}
.ios.ph{border-radius:54px;--top:54px;--bot:34px}
.and.ph{border-radius:40px;--top:40px;--bot:20px;font-family:"Noto Sans KR",Pretendard,system-ui,sans-serif}
.light{--bg:#FFFFFF;--bg2:#F4F5F7;--card:#FFFFFF;--fill:#F2F3F5;--fill2:#E9EBEE;--line:#EBEDF0;--t1:#16191D;--t2:#4B525C;--t3:#848C96;--t4:#B4BAC2;--ac:#5B4CF0;--acSoft:#EFEDFF;--acText:#4A3BDF;--acPress:#4A3BDF;--green:#0E9F55;--greenSoft:#E6F6EE;--red:#E5484D;--redSoft:#FDEEEE;--orange:#EB6A00;--orangeSoft:#FFF2E6;--scrim:rgba(0,0,0,.4);--shadow:0 8px 28px rgba(22,25,29,.10);--paper:#FFFFFF}
.dark{--bg:#0F1012;--bg2:#17181B;--card:#1C1E22;--fill:#24272C;--fill2:#2E3238;--line:#2A2D33;--t1:#F3F4F6;--t2:#C2C7CE;--t3:#8C939C;--t4:#5C636C;--ac:#7464FF;--acSoft:rgba(116,100,255,.18);--acText:#A69CFF;--acPress:#6555F0;--green:#3CCB7F;--greenSoft:rgba(60,203,127,.14);--red:#FF6B6F;--redSoft:rgba(255,107,111,.14);--orange:#FF9A3D;--orangeSoft:rgba(255,154,61,.14);--scrim:rgba(0,0,0,.6);--shadow:0 8px 28px rgba(0,0,0,.5);--paper:#24272C}
.ic{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit;letter-spacing:inherit}
input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
.ph input::placeholder,.ph textarea::placeholder{color:var(--t4)}
.cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-variant-numeric:tabular-nums}

/* type */
.h1{font-size:26px;line-height:36px;font-weight:800;letter-spacing:-.03em}
.h2{font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.025em}
.h3{font-size:17px;line-height:24px;font-weight:700}
.b1{font-size:16px;line-height:24px}
.b2{font-size:15px;line-height:22px}
.c1{font-size:13px;line-height:18px}
.c2{font-size:12px;line-height:16px}
.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.ac{color:var(--acText)}
.w6{font-weight:600}.w7{font-weight:700}

/* surfaces & controls */
.sec{height:10px;background:var(--bg2)}
.cardg{background:var(--bg2);border-radius:20px;padding:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:56px;border-radius:16px;font-size:17px;font-weight:700;transition:transform .1s ease,background .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);color:#FFFFFF}
.btn.sec2{background:var(--fill);color:var(--t1)}
.btn.sm{height:40px;border-radius:12px;font-size:14px;padding:0 14px}
.chip{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 14px;border-radius:17px;font-size:14px;font-weight:600;white-space:nowrap;flex:none;background:var(--fill);color:var(--t2)}
.chip.on{background:var(--t1);color:var(--bg)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.ac{background:var(--acSoft);color:var(--acText)}
.badge.red{background:var(--redSoft);color:var(--red)}
.badge.green{background:var(--greenSoft);color:var(--green)}
.badge.grey{background:var(--fill);color:var(--t2)}
.badge.orange{background:var(--orangeSoft);color:var(--orange)}
.logo{display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-weight:800;flex:none}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;color:var(--t1);flex:none}

/* top bars */
.topbar{position:absolute;left:0;right:0;top:var(--top);height:56px;display:flex;align-items:center;padding:0 8px 0 20px;gap:2px;background:var(--bg);z-index:3}
.topbar.nav{padding:0 8px}
.topbar .ttl{flex:1;min-width:0;font-size:17px;line-height:24px;font-weight:700;text-align:center}
.topcover{position:absolute;left:0;right:0;top:0;height:var(--top);background:var(--bg);z-index:3}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(58px + var(--bot));padding-bottom:var(--bot);box-sizing:border-box;display:flex;background:var(--bg);border-top:1px solid var(--line);z-index:4}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--t4);font-size:11px;line-height:14px;font-weight:600}
.tabbar a.on{color:var(--t1)}
.homebar{position:absolute;left:50%;bottom:8px;width:134px;margin-left:-67px;height:5px;border-radius:3px;background:var(--t1);opacity:.9;z-index:6}
.and .homebar{width:108px;margin-left:-54px;height:4px;bottom:8px;opacity:.5}

/* ===== chat ===== */
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bubble{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes caret{to{visibility:hidden}}
@keyframes glyph{0%{content:"\00B7"}16.6%{content:"\2722"}33.3%{content:"\2733"}50%{content:"\2736"}66.6%{content:"\273B"}83.3%{content:"\273D"}}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes strike{from{background-size:0 1.5px}to{background-size:100% 1.5px}}
@keyframes rowIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes panelUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes spinz{to{transform:rotate(360deg)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes fadeIn{from{opacity:0}}

.thread{position:absolute;left:0;right:0;display:flex;flex-direction:column;justify-content:flex-end;gap:18px;overflow:hidden;padding:0 20px}
.me{align-self:flex-end;max-width:82%;padding:11px 15px;border-radius:20px 20px 6px 20px;background:var(--fill);font-size:16px;line-height:23px;animation:bubble .4s cubic-bezier(.2,.9,.25,1.15) both;transform-origin:100% 100%}
.me .att{display:flex;align-items:center;gap:6px;margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--bg);font-size:13px;font-weight:600}
.msg{display:flex;gap:10px;font-size:16px;line-height:24px;animation:up .3s ease-out both}
.dot{width:8px;height:8px;border-radius:4px;background:var(--t1);flex:none;margin-top:8px}
.dot.ac{background:var(--ac)}
.dot.run{background:var(--t3);animation:blink 1s ease-in-out infinite}
.dot.ok{background:var(--green)}
.dot.err{background:var(--red)}
.dot.q{background:var(--orange)}
.mc{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tool{display:flex;flex-direction:column;gap:4px;animation:up .3s ease-out both}
.tool .hd{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:22px}
.tool .hd b{font-weight:700}
.tool .arg{color:var(--t3);font-weight:500}
.res{display:flex;gap:8px;padding-left:4px;font-size:14px;line-height:20px;color:var(--t2)}
.res:before{content:"";width:10px;height:10px;margin-top:2px;border-left:1.5px solid var(--t4);border-bottom:1.5px solid var(--t4);border-bottom-left-radius:3px;flex:none}
.res .more{color:var(--t3);font-weight:600}
.shim{background-image:linear-gradient(90deg,var(--t3) 0%,var(--t3) 38%,var(--t1) 50%,var(--t3) 62%,var(--t3) 100%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2s linear infinite}
.shim-ac{background-image:linear-gradient(90deg,var(--acText) 0%,var(--acText) 38%,var(--t1) 50%,var(--acText) 62%,var(--acText) 100%)}
.glyph{display:inline-block;width:18px;text-align:center;color:var(--ac);font-family:"Noto Sans Symbols 2","Apple Symbols","Segoe UI Symbol",sans-serif;font-size:17px;line-height:20px}
.glyph:after{content:"\273B";animation:glyph 1.1s steps(1) infinite}
.glyph.still:after{animation:none;content:"\273B"}
.spinline{display:flex;align-items:center;gap:8px;font-size:15px;line-height:22px;font-weight:600}
.spinline .meta{font-weight:500;color:var(--t3);font-size:13px}
.todo{display:flex;flex-direction:column;gap:7px;padding:14px 16px;border-radius:16px;background:var(--bg2);animation:up .3s ease-out both}
.todo .tt{font-size:13px;line-height:18px;font-weight:700;color:var(--t3);display:flex;justify-content:space-between}
.td{display:flex;align-items:center;gap:10px;font-size:15px;line-height:22px}
.box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--t4);box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex:none;color:#FFFFFF}
.td.done{color:var(--t3)}
.td.done .box{background:var(--t3);border-color:var(--t3);animation:pop .35s cubic-bezier(.3,1.5,.5,1) both}
.td.done span{background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 55%;background-size:100% 1.5px;animation:strike .35s ease-out both}
.td.now{font-weight:700}
.td.now .box{border-color:var(--ac);border-width:2px}
.td.now .box:after{content:"";width:8px;height:8px;border-radius:2px;background:var(--ac);animation:blink 1s ease-in-out infinite}
.diff{border-radius:14px;overflow:hidden;background:var(--bg2);font-size:13px;line-height:20px;animation:up .3s ease-out both}
.dl{display:flex;gap:10px;padding:5px 12px}
.dl .n{width:16px;flex:none;text-align:right;color:var(--t4);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px}
.dl .sg{width:10px;flex:none;font-weight:700}
.dl.add{background:var(--greenSoft)}
.dl.add .sg{color:var(--green)}
.dl.del{background:var(--redSoft);color:var(--t2)}
.dl.del .sg{color:var(--red)}
.dl.del span:last-child{text-decoration:line-through;text-decoration-color:var(--red)}
.fit{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;background:var(--bg2);animation:up .3s ease-out both}
.frow{display:grid;grid-template-columns:76px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px;line-height:18px;color:var(--t2)}
.frow b{color:var(--t1);text-align:right}
.bar{height:8px;border-radius:4px;background:var(--fill2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ac);transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) .15s both}
.bar i.lo{background:var(--orange)}
.file{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1px solid var(--line);animation:up .3s ease-out both}
.fi{width:40px;height:48px;border-radius:8px;background:var(--redSoft);color:var(--red);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;box-sizing:border-box;font-size:10px;font-weight:800;flex:none}
.think{display:flex;align-items:center;gap:6px;font-size:14px;line-height:20px;color:var(--t3);font-style:italic}
.caretc{display:inline-block;width:2px;height:1.1em;margin-left:1px;vertical-align:-3px;background:var(--ac);animation:caret 1s steps(2,start) infinite}
.worked{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t3)}
.worked .glyph{font-size:14px;color:var(--t3);width:14px}
.int{display:flex;gap:8px;padding-left:4px;font-size:14px;line-height:20px;color:var(--red);font-weight:600}
.int:before{content:"";width:10px;height:10px;margin-top:2px;border-left:1.5px solid var(--t4);border-bottom:1.5px solid var(--t4);border-bottom-left-radius:3px;flex:none}
.queued{align-self:flex-end;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:14px;border:1.5px dashed var(--t4);color:var(--t2);font-size:14px;line-height:20px;max-width:82%}

/* composer */
.composer{position:absolute;left:0;right:0;bottom:0;padding:8px 12px calc(var(--bot) + 8px);background:var(--bg);display:flex;flex-direction:column;gap:8px;z-index:4}
.cbox{display:flex;align-items:flex-end;gap:6px;min-height:52px;padding:6px;border-radius:26px;background:var(--fill);box-sizing:border-box}
.cbox input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:16px;padding:0 4px;height:40px}
.cbtn{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--t2)}
.send{background:var(--ac);color:#FFFFFF}
.send.off{background:var(--fill2);color:var(--t4)}
.stopb{background:var(--t1);color:var(--bg)}
.stopb i{width:12px;height:12px;border-radius:3px;background:currentColor}
.statusrow{display:flex;align-items:center;gap:8px;padding:0 8px;height:28px}
.statusrow .esc{margin-left:auto;font-size:12px;font-weight:600;color:var(--t3);padding:4px 10px;border-radius:12px;background:var(--fill)}

/* approval panel */
.panel{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:20px 16px calc(var(--bot) + 12px);background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:6px;animation:panelUp .42s cubic-bezier(.2,.9,.25,1) both}
.panel .q{font-size:18px;line-height:26px;font-weight:700;padding:0 4px 8px}
.ch{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border-radius:14px;font-size:16px;line-height:22px;font-weight:600;width:100%;box-sizing:border-box;text-align:left;transition:background .15s,transform .1s}
.ch:active{transform:scale(.98)}
.ch .k{width:24px;height:24px;border-radius:8px;background:var(--fill);color:var(--t2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none}
.ch.sel{background:var(--acSoft);color:var(--acText)}
.ch.sel .k{background:var(--ac);color:#FFFFFF}
.ch .hint{margin-left:auto;font-size:13px;font-weight:500;color:var(--t3)}
.panel .foot{display:flex;justify-content:center;font-size:12px;color:var(--t4);padding-top:6px}

/* mention popover */
.pop{position:absolute;left:12px;right:12px;z-index:5;background:var(--card);border-radius:20px;box-shadow:var(--shadow),0 0 0 1px var(--line);padding:8px;display:flex;flex-direction:column;animation:up .25s ease-out both}
.pop .sec-t{font-size:12px;font-weight:700;color:var(--t3);padding:8px 10px 4px}
.pop .it{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;font-size:15px;line-height:21px}
.pop .it.hl{background:var(--fill)}
.pop .it .sub{font-size:12px;color:var(--t3)}
.mtag{display:inline-flex;align-items:center;padding:0 6px;border-radius:6px;background:var(--acSoft);color:var(--acText);font-weight:700}

/* ===== iOS 26 Liquid Glass layer (Android keeps the solid brand versions) ===== */
.light{--glass:rgba(255,255,255,.6);--sheet:rgba(250,250,252,.84);--glassShadow:0 6px 24px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.06),inset 0 1px 0 rgba(255,255,255,.95)}
.dark{--glass:rgba(44,46,52,.58);--sheet:rgba(32,34,38,.86);--glassShadow:0 6px 24px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.16)}
.ios.ph{--tabH:94px}
.and.ph{--tabH:calc(58px + var(--bot))}
.ios .gl,.ios .iconbtn,.ios .tabbar,.ios .cbox,.ios .btn.sec2,.ios .esc,.ios .toastg,.ios .statusrow{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);box-shadow:var(--glassShadow)}
.ios .panel,.ios .pop{background:var(--sheet);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);box-shadow:0 -4px 40px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.3)}
.ios .topbar{background:transparent;padding:0 12px 0 20px}
.ios .topbar.nav{padding:0 12px}
.ios .topbar .iconbtn{margin-left:8px}
.ios .topbar.nav .iconbtn:first-child{margin-left:0}
.ios .topcover{height:calc(var(--top) + 76px);background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 88%,transparent) 0%,color-mix(in srgb,var(--bg) 60%,transparent) 62%,transparent 100%);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent)}
.ios .tabbar{left:20px;right:20px;bottom:22px;height:62px;padding:0 4px;border-radius:31px;border-top:0;align-items:center}
.ios .tabbar a{height:54px;border-radius:27px;font-size:10px}
.ios .tabbar a.on{background:var(--fill);color:var(--acText)}
.ios .tabbar a{color:var(--t1)}
.ios .homebar{bottom:8px}
.ios .composer{background:transparent;padding:6px 16px calc(var(--bot) - 6px)}
.ios .cbox{border-radius:26px}
.ios .send.off{background:var(--fill)}
.ios .statusrow{align-self:flex-start;height:36px;padding:0 4px 0 12px;border-radius:18px}
.ios .statusrow .esc{box-shadow:none;background:var(--fill);-webkit-backdrop-filter:none;backdrop-filter:none}
.ios .panel{left:8px;right:8px;bottom:8px;border-radius:40px;padding:22px 14px 18px}
.ios .ch .k{background:var(--fill)}
.ios .pop{border-radius:26px}
.ios .btn{border-radius:28px}
.ios .btn.pri{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 22px color-mix(in srgb,var(--ac) 32%,transparent)}
.ios .btn.sm{border-radius:20px}
.ios .chip{border-radius:17px}
.ios .chip:not(.on){background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);box-shadow:var(--glassShadow);color:var(--t1)}
.ios .file{border:0;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);box-shadow:var(--glassShadow)}
.toastg{background:var(--t1);color:var(--bg)}
.ios .toastg{color:var(--t1)}

/* ===== shared screen components ===== */
.ios .and-only,.and .ios-only{display:none!important}
.search{display:flex;align-items:center;gap:8px;height:48px;border-radius:24px;padding:0 16px;background:var(--fill);color:var(--t3);font-size:16px;box-sizing:border-box}
.ios .search{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);box-shadow:var(--glassShadow)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:44px;padding:4px;border-radius:22px;background:var(--fill);box-sizing:border-box}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg span{display:flex;align-items:center;justify-content:center;border-radius:18px;font-size:15px;font-weight:600;color:var(--t3)}
.seg span.on{background:var(--bg);color:var(--t1);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.dark .seg span.on{background:var(--fill2)}
.ios .seg{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);box-shadow:var(--glassShadow)}
.ios .seg span.on{background:var(--fill)}
