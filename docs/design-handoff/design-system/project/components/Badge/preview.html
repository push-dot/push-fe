<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><style>html,body{margin:0}body{background:var(--bg);color:var(--t1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;letter-spacing:-.02em;padding:16px;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}.col{display:flex;flex-direction:column;gap:var(--space-3)}

<body>
<div class="row"><span class="bd ac">적합도 6.9</span><span class="bd grey">지원함</span><span class="bd red">D-2</span><span class="bd green">합격</span><span class="bd orange">면접</span><span class="bd ac">확인 필요</span></div>

</html>
