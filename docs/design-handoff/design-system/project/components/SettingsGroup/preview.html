<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><style>html,body{margin:0}body{background:var(--bg);color:var(--t1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;letter-spacing:-.02em;padding:16px;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}.col{display:flex;flex-direction:column;gap:var(--space-3)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;letter-spacing:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.gt{font-size:13px;line-height:18px;font-weight:700;color:var(--t3);padding:0 8px 8px}.grp{border-radius:var(--radius-lg);background:var(--bg2);padding:0 16px;max-width:380px}.it{display:flex;align-items:center;gap:12px;min-height:56px;font-size:16px}.it+.it{border-top:1px solid var(--line)}.v{color:var(--t3);display:flex}.sel{display:flex;align-items:center;gap:4px;height:34px;padding:0 10px 0 12px;border-radius:10px;background:var(--fill);font-size:15px;font-weight:600}.gn{font-size:12px;line-height:17px;color:var(--t3);padding:8px 8px 0}</style></head>
<body>
<div class="gt">AI가 참고하는 내 정보</div><div class="grp"><div class="it"><span style="flex:1">백엔드 엔지니어</span><span class="v"><svg viewBox="0 0 24 24" width="16" height="16" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></svg></span></div><div class="it"><span style="flex:1">언어</span><span class="sel">한국어<svg viewBox="0 0 24 24" width="16" height="16" style="fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="m6 9.5 6 6 6-6"/></svg></span></div></div><div class="gn">대화를 시작할 때 AI가 이 정보부터 읽어요.</div>
</body>
</html>
