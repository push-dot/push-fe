<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><style>html,body{margin:0}body{background:var(--bg);color:var(--t1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;letter-spacing:-.02em;padding:16px;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}.col{display:flex;flex-direction:column;gap:var(--space-3)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;letter-spacing:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.wrap{position:relative;height:296px;border-radius:var(--radius-lg);overflow:hidden;background:var(--bg2)}.scrim{position:absolute;inset:0;background:var(--scrim)}.sh{position:absolute;left:8px;right:8px;bottom:8px;border-radius:40px;background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--shadow-glass);padding:12px 16px 16px;display:flex;flex-direction:column;gap:14px}.grab{width:36px;height:5px;border-radius:3px;background:var(--t4);align-self:center;opacity:.6}.x{width:36px;height:36px;border-radius:18px;background:var(--fill);display:flex;align-items:center;justify-content:center}.btn{height:56px;border-radius:var(--radius-md);background:var(--ac);color:#FFFFFF;font-size:17px;font-weight:700}</style></head>
<body>
<div class="wrap"><div class="scrim"></div><div class="sh"><div class="grab"></div>
<div style="display:flex;align-items:flex-start;gap:8px"><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span class="h2">어떤 공고와 비교할까요?</span><span class="b2" style="color:var(--t3)">공고 요건과 내 서류를 비교해 부족한 점을 찾아요.</span></span><button class="x" aria-label="닫기"><svg viewBox="0 0 24 24" width="16" height="16" style="fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div>
<button class="btn">부족한 점 찾기</button></div></div>
</body>
</html>
