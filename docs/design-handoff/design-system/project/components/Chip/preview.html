<!doctype html>

<div class="row"><span class="chip on"><svg viewBox="0 0 24 24" width="14" height="14" style="fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>개발</span><span class="chip on"><svg viewBox="0 0 24 24" width="14" height="14" style="fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>데이터</span><span class="chip">디자인</span><span class="chip on">Kotlin<svg viewBox="0 0 24 24" width="12" height="12" style="fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></span></div></div>
