<!-- @dsCard group="AI chat" height=300 -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><style>html,body{margin:0}body{background:var(--bg);color:var(--t1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;letter-spacing:-.02em;padding:16px;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}.col{display:flex;flex-direction:column;gap:var(--space-3)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;letter-spacing:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.pn{max-width:400px;border-radius:40px;padding:22px 14px 18px;background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--shadow-glass);display:flex;flex-direction:column;gap:6px}.qq{font-size:18px;line-height:26px;font-weight:700;padding:0 4px 8px}.ch{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border-radius:14px;font-size:16px;font-weight:600;text-align:left}.ch .k{width:24px;height:24px;border-radius:8px;background:var(--fill);color:var(--t2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none}.ch.sel{background:var(--ac-soft);color:var(--ac-text)}.ch.sel .k{background:var(--ac);color:#FFFFFF}.hint{margin-left:auto;font-size:13px;font-weight:500;color:var(--t3)}.ft{text-align:center;font-size:12px;color:var(--t4);padding-top:6px}</style></head>
<body>
<div class="pn"><div class="qq">경력 섹션을 이렇게 바꿀까요?</div>
<button class="ch sel"><span class="k">1</span>네, 반영해 주세요</button><button class="ch"><span class="k">2</span>네, 이번 대화에선 묻지 않기</button><button class="ch"><span class="k">3</span>아니요, 다르게 해 주세요<span class="hint">직접 말하기</span></button>
<div class="ft">번호를 누르거나 바로 말해도 돼요</div></div>
</body>
</html>
