<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><style>html,body{margin:0}body{background:var(--bg);color:var(--t1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;letter-spacing:-.02em;padding:16px;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}.col{display:flex;flex-direction:column;gap:var(--space-3)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;letter-spacing:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.stage{padding:20px;border-radius:var(--radius-lg);background:var(--bg2)}.gl{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);box-shadow:var(--shadow-glass);color:var(--t1)}.ib{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center}.cap{display:flex;align-items:center;height:44px;border-radius:22px;padding:0 4px}.cap button{height:44px;min-width:40px;display:flex;align-items:center;justify-content:center}.nb{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:var(--red);color:#FFFFFF;font-size:11px;line-height:18px;font-weight:800;text-align:center}</style></head>
<body>
<div class="stage"><div class="row" style="gap:10px">
<button class="gl ib" aria-label="검색"><svg viewBox="0 0 24 24" width="22" height="22" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="M17.5 10.5a7 7 0 1 1-14 0 7 7 0 0 1 14 0ZM15.5 15.5 21 21"/></svg></button><button class="gl ib" aria-label="알림" style="position:relative"><svg viewBox="0 0 24 24" width="22" height="22" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15ZM10 20.5a2 2 0 0 0 4 0"/></svg><span class="nb">3</span></button>
<span class="gl cap"><button aria-label="북마크" style="color:var(--ac-text)"><svg viewBox="0 0 24 24" width="22" height="22" style="fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="M6.5 3.5h11v17L12 16.5l-5.5 4Z"/></svg></button><button aria-label="공유"><svg viewBox="0 0 24 24" width="22" height="22" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="M12 3.5v11M8 7l4-3.5L16 7M8.5 10.5h-2v10h11v-10h-2"/></svg></button></span>
<span class="gl cap"><button style="color:var(--ac-text);font-weight:700;font-size:15px;padding:0 8px">팔로우</button><button aria-label="더 보기"><svg viewBox="0 0 24 24" width="22" height="22" style="fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="M5.5 12h.01M12 12h.01M18.5 12h.01"/></svg></button></span></div></div>
</body>
</html>
