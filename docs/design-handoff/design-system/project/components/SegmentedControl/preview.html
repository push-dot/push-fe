<!-- @dsCard group="Inputs" height=120 -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><style>html,body{margin:0}body{background:var(--bg);color:var(--t1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;letter-spacing:-.02em;padding:16px;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}.col{display:flex;flex-direction:column;gap:var(--space-3)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;letter-spacing:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:44px;padding:4px;border-radius:var(--radius-pill);background:var(--fill);box-sizing:border-box}.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}.seg span{display:flex;align-items:center;justify-content:center;border-radius:18px;font-size:15px;font-weight:600;color:var(--t3)}.seg span.on{background:var(--bg);color:var(--t1);box-shadow:0 2px 8px rgba(0,0,0,.08)}</style></head>
<body>
<div class="col" style="max-width:360px"><div class="seg"><span>프로필</span><span class="on">서류</span><span>내 활동</span></div><div class="seg two"><span class="on">받은 제안 4</span><span>보낸 제안 3</span></div></div>
</body>
</html>
