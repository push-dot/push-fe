<!-- @dsCard group="AI chat" height=230 -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><style>html,body{margin:0}body{background:var(--bg);color:var(--t1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;letter-spacing:-.02em;padding:16px;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}.col{display:flex;flex-direction:column;gap:var(--space-3)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;letter-spacing:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.nb{border-radius:28px;padding:16px 10px 10px 18px;display:flex;flex-direction:column;gap:14px;background:var(--bg2);box-shadow:var(--shadow-glass)}.ph{font-size:17px;color:var(--t4)}.rb{width:40px;height:40px;border-radius:20px;background:var(--fill);display:flex;align-items:center;justify-content:center;flex:none}.rb.off{background:var(--fill2);color:var(--t4)}.rb.stop{background:var(--t1);color:var(--bg)}.rb.stop i{width:12px;height:12px;border-radius:3px;background:currentColor}.mb{height:40px;padding:0 14px;border-radius:20px;background:var(--fill);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}</style></head>
<body>
<div class="col" style="max-width:380px"><div class="nb"><span class="ph">공고 링크를 붙여넣어 보세요</span><div class="row" style="flex-wrap:nowrap"><button class="rb" aria-label="첨부"><svg viewBox="0 0 24 24" width="20" height="20" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button class="mb"><svg viewBox="0 0 24 24" width="16" height="16" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-3.5 7.1"/></svg>언급</button><span style="flex:1"></span><button class="rb" aria-label="음성 입력"><svg viewBox="0 0 24 24" width="18" height="18" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="M15 6a3 3 0 0 0-6 0v5a3 3 0 0 0 6 0ZM5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button><button class="rb off" aria-label="보내기"><svg viewBox="0 0 24 24" width="20" height="20" style="fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="M12 19.5v-15M5.5 11 12 4.5 18.5 11"/></svg></button></div></div>
<div class="nb"><span class="ph" style="color:var(--t3)">작업 중에도 말할 수 있어요</span><div class="row" style="flex-wrap:nowrap"><button class="rb" aria-label="첨부"><svg viewBox="0 0 24 24" width="20" height="20" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button class="mb"><svg viewBox="0 0 24 24" width="16" height="16" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-3.5 7.1"/></svg>언급</button><span style="flex:1"></span><button class="rb stop" aria-label="중지"><i></i></button></div></div></div>
</body>
</html>
