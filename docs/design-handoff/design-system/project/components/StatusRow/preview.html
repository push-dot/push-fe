<!-- @dsCard group="AI chat" height=80 -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><style>html,body{margin:0}body{background:var(--bg);color:var(--t1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;letter-spacing:-.02em;padding:16px;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}.col{display:flex;flex-direction:column;gap:var(--space-3)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;letter-spacing:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}@keyframes g{0%{content:"\2722"}25%{content:"\2733"}50%{content:"\2736"}75%{content:"\273B"}}@keyframes s{from{background-position:120% 0}to{background-position:-120% 0}}.st{display:flex;align-items:center;gap:8px;height:36px;padding:0 4px 0 12px;border-radius:18px;background:var(--bg2);box-shadow:var(--shadow-glass)}.gl{width:18px;text-align:center;color:var(--ac);font-family:"Noto Sans Symbols 2","Apple Symbols",sans-serif;font-size:17px}.gl:after{content:"\273B";animation:g 1.1s steps(1) infinite}.sh{font-size:15px;font-weight:600;background-image:linear-gradient(90deg,var(--ac-text) 0%,var(--ac-text) 38%,var(--t1) 50%,var(--ac-text) 62%,var(--ac-text) 100%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:s 2s linear infinite}.esc{font-size:12px;font-weight:600;color:var(--t3);padding:4px 10px;border-radius:12px;background:var(--fill)}@media (prefers-reduced-motion:reduce){.gl:after,.sh{animation:none}}</style></head>
<body>
<div class="row"><div class="st"><span class="gl"></span><span class="sh">맞춰보는 중…</span><span class="c1" style="color:var(--t3)">14초</span><button class="esc">중지</button></div></div>
</body>
</html>
