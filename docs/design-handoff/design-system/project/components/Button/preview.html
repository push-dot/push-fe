<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><style>html,body{margin:0}body{background:var(--bg);color:var(--t1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;letter-spacing:-.02em;padding:16px;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}.col{display:flex;flex-direction:column;gap:var(--space-3)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;letter-spacing:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:56px;border-radius:var(--radius-md);font-size:17px;font-weight:700}.btn.pri{background:var(--ac);color:#FFFFFF}.btn.sec{background:var(--fill);color:var(--t1)}.btn.sm{height:40px;border-radius:var(--radius-sm);font-size:14px;padding:0 14px}.btn:disabled{opacity:.45;cursor:default}</style></head>
<body>
<div class="col" style="max-width:360px">
<button class="btn pri">지원하기</button>
<div class="row" style="flex-wrap:nowrap"><button class="btn sec" style="flex:0 0 auto;padding:0 20px">AI로 맞추기</button><button class="btn pri" style="flex:1">지원하기</button></div>
<div class="row"><button class="btn pri sm">저장</button><button class="btn sec sm"><svg viewBox="0 0 24 24" width="16" height="16" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16ZM13.5 6.5l4 4"/></svg>기본 정보 편집</button><button class="btn pri" disabled style="height:40px;font-size:14px;padding:0 14px;border-radius:var(--radius-sm)">지원 완료</button></div></div>
</body>
</html>
