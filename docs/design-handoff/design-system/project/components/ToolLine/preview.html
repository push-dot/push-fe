<!-- @dsCard group="AI chat" height=230 -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><style>html,body{margin:0}body{background:var(--bg);color:var(--t1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;letter-spacing:-.02em;padding:16px;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}.col{display:flex;flex-direction:column;gap:var(--space-3)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;letter-spacing:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}@keyframes b{50%{opacity:.25}}.tl{display:flex;flex-direction:column;gap:4px}.hd{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:22px}.hd b{font-weight:700}.arg{color:var(--t3)}.dot{width:8px;height:8px;border-radius:4px;flex:none;margin-top:7px}.ok{background:var(--green)}.run{background:var(--t3);animation:b 1s infinite}.err{background:var(--red)}.q{background:var(--orange)}.res{display:flex;gap:8px;padding-left:4px;font-size:14px;line-height:20px;color:var(--t2)}.res:before{content:"";width:10px;height:10px;margin-top:2px;border-left:1.5px solid var(--t4);border-bottom:1.5px solid var(--t4);border-bottom-left-radius:3px;flex:none}@media (prefers-reduced-motion:reduce){.run{animation:none}}</style></head>
<body>
<div class="col" style="gap:14px;max-width:420px">
<div class="tl"><div class="hd"><span class="dot ok"></span><span><b>이력서 읽기</b> <span class="arg">김서준_백엔드_이력서_2026.pdf</span></span></div><div class="res">2쪽 · 경력 2건, 프로젝트 5건</div></div>
<div class="tl"><div class="hd"><span class="dot run"></span><span><b>적합도 계산</b> <span class="arg">5개 항목</span></span></div><div class="res">기술 스택을 비교하는 중</div></div>
<div class="tl"><div class="hd"><span class="dot err"></span><span><b>공고 읽기</b> <span class="arg">회사 채용 페이지</span></span></div><div class="res" style="color:var(--red)">자격 요건을 읽지 못했어요 · 로그인이 필요한 영역이에요</div></div>
<div class="tl"><div class="hd"><span class="dot q"></span><span><b>이력서 수정</b> <span class="arg">경력 · 모아페이</span></span></div><div class="res">2줄 추가, 1줄 삭제</div></div></div>
</body>
</html>
