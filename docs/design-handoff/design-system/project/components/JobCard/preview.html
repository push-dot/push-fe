<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><style>html,body{margin:0}body{background:var(--bg);color:var(--t1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;letter-spacing:-.02em;padding:16px;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}.col{display:flex;flex-direction:column;gap:var(--space-3)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;letter-spacing:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.jc{width:200px;flex:none;display:flex;flex-direction:column;gap:2px}.ph{position:relative;height:136px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;margin-bottom:8px}.ph span{font-size:52px;font-weight:800;color:rgba(255,255,255,.92)}.bm{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:15px;background:rgba(255,255,255,.86);color:#16191D;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}.bm.on{color:#4A3BDF}.t{font-size:16px;line-height:24px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head>
<body>
<div class="row" style="gap:14px;flex-wrap:nowrap;overflow:hidden"><div class="jc"><div class="ph" style="background:linear-gradient(140deg,#1F3A8A 0%,color-mix(in srgb,#1F3A8A 55%,#000) 100%)"><span>모</span><button class="bm on" aria-label="북마크"><svg viewBox="0 0 24 24" width="16" height="16" style="fill:currentColor;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="M6.5 3.5h11v17L12 16.5l-5.5 4Z"/></svg></button></div><span class="c1" style="color:var(--t3);font-weight:600">모아페이</span><span class="t">백엔드 엔지니어 (Kotlin·Spring)</span><span class="c2" style="color:var(--t3)">서울 강남구 · 4–6년</span></div><div class="jc"><div class="ph" style="background:linear-gradient(140deg,#862E9C 0%,color-mix(in srgb,#862E9C 55%,#000) 100%)"><span>파</span><button class="bm" aria-label="북마크"><svg viewBox="0 0 24 24" width="16" height="16" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="M6.5 3.5h11v17L12 16.5l-5.5 4Z"/></svg></button></div><span class="c1" style="color:var(--t3);font-weight:600">파도AI</span><span class="t">데이터 분석가</span><span class="c2" style="color:var(--t3)">서울 서초구 · 신입</span></div><div class="jc"><div class="ph" style="background:linear-gradient(140deg,#343A40 0%,color-mix(in srgb,#343A40 55%,#000) 100%)"><span>도</span><button class="bm" aria-label="북마크"><svg viewBox="0 0 24 24" width="16" height="16" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none" aria-hidden="true"><path d="M6.5 3.5h11v17L12 16.5l-5.5 4Z"/></svg></button></div><span class="c1" style="color:var(--t3);font-weight:600">도토리증권</span><span class="t">서버 개발자 (Go)</span><span class="c2" style="color:var(--t3)">서울 영등포구 · 4–6년</span></div></div>
</body>
</html>
