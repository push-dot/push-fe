<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><style>html,body{margin:0}body{background:var(--bg);color:var(--t1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;letter-spacing:-.02em;padding:16px;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}.col{display:flex;flex-direction:column;gap:var(--space-3)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;letter-spacing:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.grp{border-radius:var(--radius-lg);background:var(--bg2);padding:0 16px;max-width:380px}.it{display:flex;align-items:center;gap:12px;min-height:56px;font-size:16px}.it+.it{border-top:1px solid var(--line)}.sw{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none}.sw:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#FFFFFF;box-shadow:0 2px 6px rgba(0,0,0,.18)}.sw.on{background:var(--ac)}.sw.on:after{transform:translateX(20px)}</style></head>
<body>
<div class="grp"><div class="it"><span style="flex:1;display:flex;flex-direction:column"><span>마감 임박 공고</span><span class="c1" style="color:var(--t3)">북마크한 공고 마감 3일 전</span></span><span class="sw on" role="switch" aria-checked="true"></span></div><div class="it"><span style="flex:1">댓글과 답글</span><span class="sw" role="switch" aria-checked="false"></span></div></div>
</body>
</html>
