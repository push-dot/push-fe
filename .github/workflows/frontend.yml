name: Frontend verification
on:
  pull_request:
  push:
    branches: ["**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils unzip
      - run: npm ci
      - run: npm test
      - run: npm run check:fsd
      - run: npm run build
