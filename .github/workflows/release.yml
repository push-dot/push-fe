name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Build app bundle
        run: pnpm exec tauri build --bundles dmg
        working-directory: apps/fo-desktop
      - name: Stage stable asset name
        run: |
          dmg=$(ls apps/fo-desktop/src-tauri/target/release/bundle/dmg/Push_*_aarch64.dmg | head -1)
          cp "$dmg" Push_aarch64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Push_aarch64.dmg
          path: Push_aarch64.dmg
          if-no-files-found: error
  nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Build app bundle
        run: pnpm exec tauri build --bundles nsis
        working-directory: apps/fo-desktop
      - name: Smoke test installed app
        run: |
          $exe = Get-ChildItem apps/fo-desktop/src-tauri/target/release/bundle/nsis/Push_*_x64-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName Push_x64-setup.exe
          Start-Process .\Push_x64-setup.exe -ArgumentList '/S' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Push\Push.exe"
          if (-not (Test-Path $app)) { throw "installed binary not found at $app" }
          $proc = Start-Process $app -PassThru
          Start-Sleep -Seconds 15
          $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $alive) { throw "Push exited within 15s of launch" }
          Stop-Process -Id $proc.Id -Force
          Write-Output "SMOKE_OK"
      - uses: actions/upload-artifact@v4
        with:
          name: Push_x64-setup.exe
          path: Push_x64-setup.exe
          if-no-files-found: error
  publish:
    needs: [dmg, nsis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Push_*
          merge-multiple: true
          path: release-assets
      - name: Publish release with stable asset names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-assets/Push_aarch64.dmg \
            release-assets/Push_x64-setup.exe \
            --title "Push ${{ github.ref_name }}" --latest
