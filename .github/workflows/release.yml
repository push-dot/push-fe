name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build app bundle
        run: npx tauri build --bundles dmg
      - name: Publish release with stable asset name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls src-tauri/target/release/bundle/dmg/Push_*_aarch64.dmg | head -1)
          cp "$dmg" Push_aarch64.dmg
          gh release create "${{ github.ref_name }}" Push_aarch64.dmg \
            --title "Push ${{ github.ref_name }}" --latest
  nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build app bundle
        run: npx tauri build --bundles nsis
      - name: Smoke test installed app
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/Push_*_x64-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName Push_x64-setup.exe
          Start-Process .\Push_x64-setup.exe -ArgumentList '/S' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Push\Push.exe"
          if (-not (Test-Path $app)) { throw "installed binary not found at $app" }
          $proc = Start-Process $app -PassThru
          Start-Sleep -Seconds 15
          $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $alive) { throw "Push exited within 15s of launch" }
          Stop-Process -Id $proc.Id -Force
          Write-Output "SMOKE_OK"
      - name: Publish release with stable asset name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" Push_x64-setup.exe --clobber
